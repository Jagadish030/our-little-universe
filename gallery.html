<style>

html,body{margin:0;height:100%;background:#1a0f1c;color:var(--cream);font-family:var(--sans);overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}

.hidden{display:none!important}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

.rbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--cream);font-size:1.25rem;text-decoration:none;border:1px solid var(--glass-b);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;font-family:var(--sans)}

#menu{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:11;padding:.4rem;border-radius:18px;display:grid;gap:2px;min-width:200px}
#menu button{border:0;background:transparent;color:var(--cream);padding:.7rem .9rem;text-align:left;border-radius:12px;font:600 .95rem var(--sans);cursor:pointer}
#menu button:active{background:rgba(255,255,255,.12)}
#joy{position:fixed;left:calc(env(safe-area-inset-left,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:132px;height:132px;border-radius:50%;z-index:9;touch-action:none;background:rgba(34,20,38,.35);border:1px solid var(--glass-b)}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:linear-gradient(135deg,#ffe2ad,#ffb199 55%,#ff98a3);box-shadow:0 6px 18px rgba(0,0,0,.4)}
#act{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);transform:translateX(-50%);z-index:9;max-width:min(78vw,380px);padding:.8rem 1.4rem;border-radius:999px;border:0;font:700 1rem var(--sans);color:#281424;background:linear-gradient(135deg,#ffe2ad,#ffb199 55%,#ff98a3);box-shadow:0 8px 26px rgba(255,150,120,.4);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 72px);transform:translateX(-50%);z-index:8;padding:.55rem 1rem;border-radius:999px;font-size:.88rem;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s;max-width:90vw}
#hint.on{opacity:1}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%) translateY(10px);z-index:30;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;text-align:center;max-width:88vw}

#loader,#gate{position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 35%,#3a2140,#160c18 70%)}
#loader p,#gate p{margin:.4rem 0;color:rgba(255,243,230,.8)}
#loader h1,#gate h1{margin:0 0 .3rem;font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.9rem;color:var(--cream)}
.spark{display:inline-block;font-size:2rem;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25);opacity:.7}}
.bar{width:min(240px,60vw);height:4px;border-radius:4px;background:rgba(255,255,255,.14);margin:1rem auto 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe2ad,#ff98a3);transition:width .3s}
.pbtn{margin-top:1rem;padding:.8rem 1.6rem;border:0;border-radius:999px;font:700 1rem var(--sans);color:#281424;background:linear-gradient(135deg,#ffe2ad,#ffb199 55%,#ff98a3);cursor:pointer;text-decoration:none;display:inline-block}

#viewer{position:fixed;inset:0;z-index:25;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);background:rgba(14,7,16,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.vbox{width:min(94vw,560px);max-height:100%;display:flex;flex-direction:column;align-items:center;gap:.7rem;animation:vin .35s cubic-bezier(.22,1,.36,1) both}
@keyframes vin{from{opacity:0;transform:scale(.94) translateY(10px)}}
.vmedia{width:100%;display:grid;place-items:center;min-height:120px}
.vmedia img,.vmedia video{max-width:100%;max-height:62vh;border-radius:8px;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.55)}

.vcap{width:100%;text-align:center;padding:.2rem .6rem}

.vnote{width:min(88vw,380px);padding:1.5rem 1.4rem 1.2rem;border-radius:6px;color:#3b2a2a;font-family:'Caveat',cursive;font-size:1.65rem;line-height:1.25;box-shadow:0 20px 50px rgba(0,0,0,.5);text-align:left;white-space:pre-wrap;max-height:60vh;overflow:auto;user-select:text;-webkit-user-select:text}
.vnote .rp{display:block;margin-top:.9rem;padding-top:.7rem;border-top:1px dashed rgba(0,0,0,.25);color:#a2455a}
.vnote .sg{display:block;margin-top:.6rem;text-align:right;font-size:1.3rem;opacity:.8}
.vlock{width:min(86vw,340px);padding:1.6rem 1.2rem;text-align:center;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid var(--glass-b)}
.vlock b{display:block;font-size:2.4rem;margin-bottom:.4rem}
#passcode{position:fixed;inset:0;z-index:35;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 30%,rgba(58,33,64,.96),rgba(18,9,20,.97) 72%)}
.pcard{width:min(92vw,360px);padding:1.6rem 1.3rem 1.3rem;border-radius:26px;text-align:center;position:relative}
.pcard h2{margin:.2rem 0 .1rem;font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.7rem}
.pcard .lock{font-size:2.2rem;animation:pulse 2.4s ease-in-out infinite}
.pcard p{margin:.2rem 0 .8rem;color:rgba(255,243,230,.72);font-size:.92rem}
.ident{display:flex;gap:10px;justify-content:center;margin-bottom:.8rem}
.ident button{width:64px;height:64px;border-radius:50%;border:1px solid var(--glass-b);background:rgba(255,255,255,.06);color:var(--cream);font:700 1.3rem var(--serif);cursor:pointer}
.ident button.on{background:linear-gradient(135deg,#ffe2ad,#ffb199 55%,#ff98a3);color:#281424;border-color:transparent}
.pcard input{width:100%;padding:.85rem 1rem;border-radius:14px;border:1px solid var(--glass-b);background:rgba(255,255,255,.08);color:var(--cream);font:600 1rem var(--sans);text-align:center;outline:none;user-select:text;-webkit-user-select:text}
.perr{min-height:1.3em;margin:.5rem 0 0;color:#ffb3b3;font-size:.85rem}
</style>

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function () {
'use strict';
/* ═══ Our Little Gallery: a walkable 3D space for the photos, doodles, notes and more.
   It reuses the site's own sign-in session and vault key (same localStorage keys),
   so it can read exactly what the main site can, and nothing more. ═══ */
const SUPABASE_URL = 'https://cctlzqlchijwrxrxnmmm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjdGx6cWxjaGlqd3J4cnhubW1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5MDg1NTksImV4cCI6MjA5OTQ4NDU1OX0.5cEM69NsRjiN2d1XqzFcqVmSp8Db0AqxRr6wLJmm5Yc';
const EMAIL_J = 'kavisetti2001@gmail.com', EMAIL_M = 'lalithamalavika@gmail.com';
const UNLOCK_SESSION_KEY = 'ourLittleUniverseUnlockedSession';
const DEVICE_REG_KEY = 'site-device-registered-at', DEVICE_REG_MS = 10 * 24 * 60 * 60 * 1000;
const VAULT_KEY_CACHE = 'site-vault-key';
const IDLE_MS = 15 * 60 * 1000;
const TEST = window.__GALLERY_TEST__ || null;   // only set by automated tests, inert otherwise

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const hashStr = (s) => { let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; };
const fmtDate = (iso) => { try { return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return ''; } };
const letterOfAuthor = (a) => (String(a) === '2' ? 'M' : 'J');
const letterOfEmail = (e) => (String(e || '').toLowerCase() === EMAIL_M ? 'M' : 'J');
function setLoad(msg, pct) { $('loadMsg').textContent = msg; if (pct != null) $('loadBar').style.width = pct + '%'; }
function toast(msg, ms) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms || 2400); }
function showGate(title, msg) { $('loader').classList.add('hidden'); $('gateTitle').textContent = title; $('gateMsg').textContent = msg; $('gate').classList.remove('hidden'); }

/* ═══ crypto: the same AES-GCM key the site derives, cached on this device ═══ */
let vaultKey = null;
const b64ToBytes = (b64) => { const bin = atob(b64); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; };
async function loadVaultKey() {
  let raw; try { raw = localStorage.getItem(VAULT_KEY_CACHE); } catch (e) { return null; }
  if (!raw) return null;
  try { return await crypto.subtle.importKey('raw', b64ToBytes(raw), { name: 'AES-GCM' }, false, ['decrypt']); } catch (e) { return null; }
}
async function decBytes(combined) {
  const iv = combined.slice(0, 12), ct = combined.slice(12);
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, vaultKey, ct));
}
async function decText(raw) {                      // falls back to the raw value when a field was never encrypted
  if (!raw) return raw || '';
  if (!vaultKey) return raw;
  try { return new TextDecoder().decode(await decBytes(b64ToBytes(raw))); } catch (e) { return raw; }
}
async function decToObjectUrl(url, mime) {
  const res = await fetch(url); if (!res.ok) throw new Error('fetch ' + res.status);
  const plain = await decBytes(new Uint8Array(await res.arrayBuffer()));
  return URL.createObjectURL(new Blob([plain], { type: mime || 'application/octet-stream' }));
}
function mimeFromPath(path, isVideo) {
  const ext = ((path || '').split('.').pop() || '').toLowerCase();
  const map = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif', heic: 'image/heic', webm: 'video/webm', mp4: 'video/mp4', mov: 'video/quicktime', m4v: 'video/mp4' };
  return map[ext] || (isVideo ? 'video/mp4' : 'image/jpeg');
}

/* ═══ clients ═══ */
let sb = null, sbJU = null, me = 'J';
const mediaCache = new Map();
async function resolveMedia(client, bucket, path, mime, fallback) {
  if (TEST) return fallback || null;
  if (!path) return fallback || null;
  const key = bucket + '/' + path;
  if (mediaCache.has(key)) return mediaCache.get(key);
  const p = (async () => {
    try {
      const { data: signed, error } = await client.storage.from(bucket).createSignedUrl(path, 3600);
      if (error || !signed || !signed.signedUrl) return fallback || null;
      let out = signed.signedUrl;
      if (vaultKey) { try { out = await decToObjectUrl(out, mime); } catch (e) { /* not encrypted: leave the signed URL */ } }
      return out;
    } catch (e) { return fallback || null; }
  })();
  mediaCache.set(key, p);
  const r = await p; if (!r) mediaCache.delete(key);
  return r;
}

/* ═══ data → items. One normalised shape for every room. ═══ */
async function fetchRows(client, table) {
  if (TEST) return (TEST.rows && TEST.rows[table]) || [];
  const { data, error } = await client.from(table).select('*').order('created_at', { ascending: true });
  if (error) throw error;
  return data || [];
}
const base = (o) => Object.assign({ type: 'photo', title: '', sub: '', fav: false, locked: false, hint: '', lockDate: '', reply: '', reaction: '', mood: '', voice: null, video: false, secret: false, author: '', created: '' }, o);
const lockedByDate = (d) => !!(d && d > todayKey());
async function loadMemories() {
  const rows = await fetchRows(sb, 'memories');
  return Promise.all(rows.map(async (r) => base({
    id: 'm' + r.id, type: 'photo', bucket: 'photos', path: r.image_path, fallback: r.image_url,
    title: await decText(r.caption), sub: r.date_label || fmtDate(r.created_at), fav: !!r.is_favorite,
    mood: await decText(r.mood), reply: await decText(r.reply), author: letterOfAuthor(r.author), created: r.created_at,
    locked: lockedByDate(r.unlock_date) || (!!r.is_surprise && r.is_revealed === false), lockDate: r.unlock_date || '',
    hint: await decText(r.surprise_hint), voice: r.voice_path ? { bucket: 'voice-notes', path: r.voice_path } : null,
  })));
}
async function loadDoodles() {
  const rows = await fetchRows(sb, 'doodles');
  return Promise.all(rows.map(async (r) => {
    const mode = String(r.mode || '').toLowerCase();
    return base({
      id: 'd' + r.id, type: 'doodle', bucket: 'doodles', path: r.storage_path, fallback: r.image_url,
      title: await decText(r.caption), sub: (mode === 'duet' ? 'Duet' : 'Solo') + ' doodle · ' + letterOfAuthor(r.author), fav: !!r.favorite,
      reply: await decText(r.reply), reaction: await decText(r.reaction), author: letterOfAuthor(r.author), created: r.created_at,
      locked: lockedByDate(r.unlock_date), lockDate: r.unlock_date || '', hint: await decText(r.unlock_hint),
    });
  }));
}
async function loadNotes() {
  const rows = await fetchRows(sb, 'love_notes');
  return Promise.all(rows.map(async (r) => base({
    id: 'n' + r.id, type: 'note', title: '', text: await decText(r.message), reply: await decText(r.reply), reaction: await decText(r.reaction),
    author: letterOfAuthor(r.author), fav: !!r.is_favorite, created: r.created_at, sub: fmtDate(r.created_at),
    voice: r.audio_path ? { bucket: 'voice-notes', path: r.audio_path } : null,
  })));
}
async function loadPhotoThings() {
  const out = { booth: [], wand: [], pict: [] };
  try {
    const rows = await fetchRows(sb, 'photobooth_captures');
    out.booth = await Promise.all(rows.map(async (r) => base({
      id: 'b' + r.id, type: 'photo', bucket: 'photobooth', path: r.image_path, fallback: r.image_url, mime: 'image/png',

}

/* ═══ three.js world ═══ */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a0f1c);

    setLoad('Checking it is you…', 4);
    if (!TEST) {
      if (sessionStorage.getItem(UNLOCK_SESSION_KEY) !== '1') return showGate('Unlock the site first', 'Open Our Little Universe, enter the password, and then come into the gallery from there.');
      const ts = parseInt(localStorage.getItem(DEVICE_REG_KEY) || '0', 10);
      if (!ts || Date.now() - ts > DEVICE_REG_MS) return showGate('This device needs signing in', 'Sign in on the main site first (it asks once every ten days), then come back.');
      vaultKey = await loadVaultKey();
      if (!vaultKey) return showGate('Your vault key is missing', 'Open the main site and sign in once so this device can read your photos, then come back.');
      if (!window.supabase) return showGate('Could not load', 'Check your connection and try again.');
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'sb-site-auth', storage: window.localStorage } });
      const { data } = await sb.auth.getSession();
      if (!data || !data.session) return showGate('Please sign in', 'Open the main site and sign in, then come back to the gallery.');
      me = letterOfEmail(data.session.user.email);
    } else me = TEST.who || 'J';
    setLoad('Polishing the frames…', 12);
    await Promise.race([Promise.all([document.fonts.load('italic 600 40px "Playfair Display"'), document.fonts.load('600 40px Caveat'), document.fonts.load('600 24px Quicksand')]), wait(2500)]).catch(() => {});
    setLoad('Hanging the pictures…', 30);
    const [mem, doo, notes, things] = await Promise.all([safe(loadMemories, []), safe(loadDoodles, []), safe(loadNotes, []), safe(loadPhotoThings, { booth: [], wand: [], pict: [] })]);
    setLoad('Building the rooms…', 70);
    await wait(30);
    const lefts = [{ id: 'memories', name: 'Memories', emoji: '📷', zc: 8 }, { id: 'notes', name: 'Love Notes', emoji: '💌', zc: 22 }, { id: 'special', name: 'Special Days', emoji: '🎉', zc: 36 }];
    const rights = [{ id: 'doodles', name: 'Doodles', emoji: '✏️', zc: 8 }, { id: 'things', name: 'Photo Things', emoji: '🪄', zc: 22 }];
    buildHall(lefts, rights);
    buildRoom({ id: 'memories', name: 'Memories', emoji: '📷', pos: [-4.4, 8], rotY: Math.PI, theme: THEMES.cream, layout: 'gallery', feature: true, benches: true, items: mem });
    buildRoom({ id: 'notes', name: 'Love Notes', emoji: '💌', pos: [-4.4, 22], rotY: Math.PI, theme: THEMES.rose, layout: 'notes', items: notes });
    buildRoom({ id: 'special', name: 'Special Days', emoji: '🎉', pos: [-4.4, 36], rotY: Math.PI, theme: THEMES.gala, layout: 'specials', items: loadSpecials() });
    buildRoom({ id: 'doodles', name: 'Doodles', emoji: '✏️', pos: [4.4, 8], rotY: 0, theme: THEMES.mint, layout: 'gallery', feature: true, benches: true, items: doo });
    buildRoom({ id: 'things', name: 'Photo Things', emoji: '🪄', pos: [4.4, 22], rotY: 0, theme: THEMES.lilac, layout: 'mixed',
      sections: [{ label: 'Photobooth', emoji: '📸', items: things.booth }, { label: 'Magic Wand', emoji: '🪄', items: things.wand }, { label: 'Pictionary', emoji: '🎨', items: things.pict }] });
    me3d = makeAvatar(me); scene.add(me3d); player.x = (me === 'M' ? 0.9 : -0.9); player.z = 9; player.heading = 0;
    buildMenu(); slowTick(); startLive();
    setLoad('Ready ✦', 100); await wait(250);
    $('loader').classList.add('hidden'); $('top').classList.remove('hidden');
    const coarse = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;
    if (coarse) joyEl.classList.remove('hidden');
    const hint = $('hint'); hint.textContent = coarse ? 'Drag to look · joystick to walk · tap a picture to open it' : 'WASD to walk · drag to look · click a picture to open it'; hint.classList.add('on'); setTimeout(() => hint.classList.remove('on'), 6500);
    running = true;
  } catch (e) { console.error(e); showGate('Something went wrong', 'The gallery could not open. Please go back and try again.'); }
}
requestAnimationFrame(loop);
boot();
})();
</script>
</body>
</html>
