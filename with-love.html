<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#180c17">
<meta name="robots" content="noindex,nofollow">
<title>A birthday in our hearts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#180c17; --dusk:#36142d; --cream:#fff3e6; --muted:#e4cfd3;
  --gold:#ffc478; --rose:#ff9e9e; --ink:#362626;
  --glass:rgba(255,243,230,.07); --glass-border:rgba(255,220,180,.18);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --bar-h:64px; --nav-h:84px;
  --warm:0;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:var(--cream);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(130% 85% at 50% 110%,rgba(255,165,105,calc(.11 + var(--warm)*.38)) 0%,transparent 66%),
    radial-gradient(70% 50% at 82% 14%,rgba(255,215,160,calc(.04 + var(--warm)*.08)) 0%,transparent 70%),
    linear-gradient(180deg,#120814 0%,#261024 54%,#481d2d 100%)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,canvas:focus-visible,.paper-scroll:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* frame: top bar, fitted stage, bottom nav */
.bar{position:fixed;top:0;left:0;right:0;z-index:6;height:calc(var(--bar-h) + var(--sat));padding:var(--sat) 16px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;font-size:1.05rem;padding:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 4px 14px rgba(0,0,0,.22);transition:transform .2s ease,background .25s ease,border-color .25s ease}
.iconbtn:hover{background:rgba(255,243,230,.13);border-color:rgba(255,220,180,.34)}
.iconbtn:active{transform:scale(.93)}
.dots{display:flex;gap:7px;align-items:center;padding:6px 12px;border-radius:999px;background:rgba(20,10,20,.28);border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22);transition:all .45s cubic-bezier(.22,1,.36,1)}
.dots i.on{background:var(--gold);width:22px;border-radius:6px;box-shadow:0 0 10px rgba(255,196,120,.6)}
.dots i.past{background:rgba(255,207,138,.58)}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;height:calc(var(--nav-h) + var(--sab));padding:0 18px var(--sab);display:flex;align-items:center;justify-content:center;gap:12px}
#stage{position:fixed;left:0;right:0;top:calc(var(--bar-h) + var(--sat));bottom:calc(var(--nav-h) + var(--sab));z-index:2;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:6px 20px}
body.nonav #stage{bottom:var(--sab)}
.fit{flex:none;width:100%;max-width:520px;display:flex;justify-content:center;transform-origin:50% 50%}
.scene{width:100%;text-align:center;animation:enter .75s cubic-bezier(.22,1,.36,1) both}
.scene.out{animation:leave .26s ease both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:translateY(-8px)}}

/* typography */
h1,h2{font-family:var(--serif);font-style:italic;font-weight:600;margin:.15em 0 .28em;line-height:1.1;letter-spacing:.01em;text-shadow:0 2px 18px rgba(255,190,130,.18)}
h1{font-size:clamp(2.25rem,9vw,3.45rem)}
h2{font-size:clamp(1.75rem,6.5vw,2.45rem)}
.lead{font-size:1.08rem;line-height:1.6;color:var(--cream);margin:.4rem auto;max-width:31ch}
.small{font-size:.94rem;line-height:1.6;color:var(--muted);margin:.55rem auto;max-width:35ch}
.hint{font-size:.92rem;color:var(--muted);margin:0 auto;max-width:34ch;line-height:1.55}

/* buttons & chips */
.btn{border:0;border-radius:999px;min-height:48px;padding:.8rem 1.8rem;font-weight:700;font-size:.98rem;letter-spacing:.01em;color:#281424;background:linear-gradient(135deg,#ffe2ad 0%,#ffb199 55%,#ff98a3 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 8px 26px rgba(255,150,120,.28);transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .25s ease,opacity .2s ease}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 12px 30px rgba(255,150,120,.38)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.42;cursor:default;box-shadow:none}
.btn.ghost{background:var(--glass);color:var(--cream);border:1px solid var(--glass-border);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.btn.ghost:hover:not(:disabled){background:rgba(255,243,230,.12);border-color:rgba(255,220,180,.35)}
.btn.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 8px 26px rgba(255,160,140,.24)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 8px 36px rgba(255,196,150,.65),0 0 0 5px rgba(255,196,120,.14)}}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:1.1rem}
a.btn{display:inline-grid;place-items:center;text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:.85rem 0}
.chip{border:1px solid var(--glass-border);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:.5rem 1rem;font-size:.9rem;min-height:42px;transition:background .2s ease,border-color .2s ease,transform .15s ease}
.chip:hover{background:rgba(255,243,230,.13);border-color:rgba(255,220,180,.38)}
.chip:active{transform:scale(.96)}

/* text emerging from glow */
.msg,.pcard{opacity:0}
.msg.show,.pcard.show{opacity:1}

/* cover */
.cover{position:relative;display:flex;flex-direction:column;align-items:center}
.cover::before{content:"";position:absolute;left:50%;top:30%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,207,138,.12),transparent 64%)}
.eyebrow{margin:0 0 1.5rem;font-size:.72rem;font-weight:600;letter-spacing:.38em;text-transform:uppercase;color:rgba(255,212,148,.88);animation:fadeup 1.4s ease .2s both}
@keyframes breathe{0%,100%{opacity:.22;transform:scale(.94)}50%{opacity:.88;transform:scale(1.06)}}
.cover h1{margin:1.7rem 0 .4rem;font-size:clamp(2.55rem,10vw,3.75rem);font-weight:500}
.cover .sub{margin:0 0 2.1rem;font-size:1.02rem;color:var(--muted);letter-spacing:.02em;font-family:var(--serif);font-style:italic;font-size:1.22rem}
.enter{display:inline-flex;align-items:center;min-height:50px;padding:.95rem 2.7rem;border:1px solid rgba(255,196,120,.65);border-radius:999px;background:rgba(255,196,120,.1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--gold);font-weight:600;font-size:.78rem;letter-spacing:.32em;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 28px rgba(0,0,0,.25);transition:background .3s,border-color .3s,transform .2s}
.enter:hover{background:rgba(255,207,138,.2);border-color:var(--gold);transform:translateY(-1px)}
.cover .note{max-width:38ch;margin:1.6rem auto 0;font-size:.78rem;line-height:1.6;color:rgba(227,205,208,.72)}
.linkbtn{min-height:44px;padding:.4rem .8rem;border:0;background:none;color:rgba(227,205,208,.88);font-size:.8rem;text-decoration:underline;text-underline-offset:3px}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.heartbtn{position:relative;width:min(44vw,152px);aspect-ratio:120/108;padding:0;border:0;background:none;display:block}
.heartbtn svg{display:block;width:100%;height:100%;overflow:visible}
.heart-line{fill:none;stroke:var(--gold);stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw 2.8s cubic-bezier(.5,0,.2,1) .4s forwards;filter:drop-shadow(0 0 6px rgba(255,194,122,.6))}
.heart-fill{opacity:0;transition:opacity 1.2s ease}
.cover.lit .heart-fill{opacity:1}
@keyframes draw{to{stroke-dashoffset:0}}
.heartbtn::after{content:"";position:absolute;inset:-32%;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,194,122,.26),transparent 66%);opacity:0;animation:breathe 4.6s ease-in-out 3s infinite}
.cover.lit .heartbtn::after{background:radial-gradient(circle,rgba(255,150,100,.52),transparent 66%);animation:breathe 3.2s ease-in-out infinite}
.cover.lit .heartbtn svg{animation:beat 2.4s ease-in-out 1s infinite}
.reveal{position:relative;display:flex;flex-direction:column;align-items:center}
.cover:not(.lit) .rv{visibility:hidden}
.cover.lit .rv{visibility:visible;animation:fadeup 1.3s ease var(--d,0s) both}
.lighthint{position:absolute;top:1.6rem;left:0;right:0;margin:0;font-family:var(--serif);font-style:italic;font-size:1.28rem;color:var(--gold);transition:opacity .7s;animation:fadeup 1.4s ease 3s both}
.cover.lit .lighthint{opacity:0;animation:none}
.spark{position:fixed;z-index:30;width:6px;height:6px;margin:-3px;border-radius:50%;background:radial-gradient(circle,#fff5d6,#ffb36b);pointer-events:none;animation:bit .9s ease-out forwards}
.cover.leave{transition:transform .9s cubic-bezier(.5,0,.3,1),opacity .8s ease;transform:scale(1.08);opacity:0}

/* cake and candles */
.slot{height:10.5rem;display:flex;flex-direction:column;align-items:center;width:100%}
.slot.top{justify-content:flex-end;padding-bottom:.4rem}
.slot.top>*{grid-area:auto}
.slot.bot{justify-content:center;padding-top:2rem}
.stack{position:relative;width:100%;display:grid;justify-items:center;align-items:end}
.stack>*{grid-area:1/1}
.fold{transition:opacity .9s ease}
.fold.gone{opacity:0}
.cap{opacity:0;transition:opacity 1.1s ease}
.cap.show{opacity:1}
.cap h2{margin:0 0 .25rem}
.cap .lead{margin:.1rem auto}
.cakebox{position:relative;width:100%;display:flex;justify-content:center}
.cake{position:relative;width:max(220px,min(88vw,480px,calc((100dvh - 380px) * 1.3)));aspect-ratio:300/230;transition:transform 1.7s cubic-bezier(.22,.8,.24,1)}
.cakebox.near .cake{transform:scale(var(--zoom,1.22))}
.cake>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 14px 28px rgba(0,0,0,.35))}
.cake .glow{position:absolute;left:50%;top:-6%;width:135%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,198,122,.54) 0%,rgba(255,170,100,.14) 44%,transparent 70%);opacity:var(--g,0);transition:opacity 1.2s;pointer-events:none}
.wick{position:absolute;top:7.8%;width:7.4%;height:30.4%;margin-left:-3.7%;border:0;background:transparent;padding:0;z-index:2;display:grid;place-items:end center}
.wick svg{width:100%;height:100%;overflow:visible}
.wick .flame{opacity:0;transform-box:fill-box;transform-origin:50% 100%;transition:opacity .45s;filter:drop-shadow(0 0 6px rgba(255,195,95,.85))}
.wick.lit .flame{opacity:1;animation:flick 1.6s ease-in-out infinite;animation-delay:var(--fd,0s)}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-1.4deg)}35%{transform:scale(.94,1.08) rotate(1.6deg)}70%{transform:scale(1.04,.95) rotate(-.7deg)}}
.smoke{position:absolute;left:50%;top:6%;width:20px;height:20px;margin:-10px;border-radius:50%;background:radial-gradient(circle,rgba(236,231,242,.85),rgba(205,198,222,.38) 55%,transparent 72%);filter:blur(2px);opacity:0;pointer-events:none;animation:smoke 2.8s ease-out forwards}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:.7}100%{opacity:0;transform:translate(var(--sx),-110px) scale(2.6)}}
.meter{width:min(60vw,200px);height:6px;margin:0 auto .7rem;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;display:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.meter.live{display:block}
.meter i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#ffd98a,#ffa3b6);transition:width .09s linear}

/* constellation */
.constel{position:relative;width:min(88vw,42dvh,400px);aspect-ratio:1;margin:.2rem auto 0;touch-action:none;user-select:none;-webkit-user-select:none}
.constel svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.constel .edge{fill:none;stroke:rgba(255,207,138,.88);stroke-width:.85;stroke-linecap:round;stroke-dasharray:var(--len,30);stroke-dashoffset:var(--len,30);transition:stroke-dashoffset .6s ease;filter:drop-shadow(0 0 4px rgba(255,196,120,.5))}
.constel .edge.on{stroke-dashoffset:0}
.constel .trail{stroke:rgba(255,226,170,0);stroke-width:.9;stroke-dasharray:1.6 1.8;stroke-linecap:round}
.constel .trail.on{stroke:rgba(255,226,170,.9)}
.constel .fill{fill:rgba(255,155,179,0);transition:fill 2s}
.constel.done .fill{fill:rgba(255,155,179,.2)}
.cstar{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border:0;background:transparent;border-radius:50%;font-size:1.9rem;line-height:1;color:rgba(255,255,255,.78);text-shadow:0 0 10px rgba(255,255,255,.35);animation:twinkle 3s ease-in-out infinite;touch-action:none;transition:transform .25s ease,color .25s ease}
.cstar:nth-of-type(odd){animation-delay:-1.4s}
@keyframes twinkle{0%,100%{opacity:.7}50%{opacity:1}}
.cstar.on{color:var(--gold);animation:none;opacity:1;text-shadow:0 0 14px rgba(255,207,138,.95),0 0 32px rgba(255,170,100,.65);transform:scale(1.18)}
.cstar.start::after{content:"";position:absolute;inset:3px;border-radius:50%;border:2px solid rgba(255,207,138,.78);animation:ringp 1.6s ease-out infinite}
@keyframes ringp{from{transform:scale(.7);opacity:1}to{transform:scale(1.35);opacity:0}}
.flare{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff8d8,rgba(255,207,138,.75) 40%,transparent 70%);animation:flare .95s ease-out forwards}
@keyframes flare{from{transform:scale(.3);opacity:1}to{transform:scale(7);opacity:0}}
.msg{height:6.6rem;margin:.6rem auto 0;max-width:32ch;font-family:var(--serif);font-size:1.32rem;line-height:1.42;font-style:italic;display:flex;align-items:center;justify-content:center}
.count{font-size:.88rem;color:var(--muted);margin-top:.2rem;min-height:1.5em;letter-spacing:.03em}

/* lantern writing & floating lanterns */
.field{width:100%;min-height:112px;border-radius:18px;border:1px solid var(--glass-border);background:rgba(255,245,235,.07);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--cream);padding:.95rem 1.1rem;font:inherit;font-size:1.05rem;line-height:1.55;resize:none;box-shadow:inset 0 2px 8px rgba(0,0,0,.2);transition:border-color .25s ease,background .25s ease}
.field:focus{border-color:rgba(255,196,120,.6);background:rgba(255,245,235,.1)}
.field::placeholder{color:rgba(228,207,211,.65)}
#layer{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.lantern{position:absolute;width:48px;height:64px;border-radius:16px 16px 10px 10px;
  background:radial-gradient(circle at 50% 62%,#fff8dc 0%,#ffd78a 38%,#ff9654 88%);
  box-shadow:0 0 38px rgba(255,172,90,.82),0 0 12px rgba(255,230,170,.6),inset 0 -10px 16px rgba(195,70,30,.38);
  border:1px solid rgba(255,240,200,.45);padding:0;pointer-events:none;transition:transform .2s ease}
.lantern::before{content:"";position:absolute;left:9px;right:9px;top:-4px;height:5px;border-radius:4px;background:#7a3e22;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.lantern::after{content:"";position:absolute;left:13px;right:13px;bottom:-5px;height:6px;border-radius:4px;background:#7a3e22;box-shadow:0 4px 10px rgba(255,190,100,.7)}
.lantern.hers{
  background:radial-gradient(circle at 50% 62%,#fff0f6 0%,#ffb8d2 38%,#f06296 88%);
  box-shadow:0 0 38px rgba(255,110,160,.82),0 0 12px rgba(255,210,230,.55),inset 0 -10px 16px rgba(180,35,95,.38);
  border-color:rgba(255,220,235,.48)}
.lantern.hers::before,.lantern.hers::after{background:#7d2444}
.lantern.fly{bottom:-90px;animation:rise 9s cubic-bezier(.3,.1,.5,1) forwards}
@keyframes rise{0%{transform:translate(0,0) rotate(-3deg);opacity:1}50%{transform:translate(18px,-55vh) rotate(3deg)}100%{transform:translate(-10px,-125vh) rotate(-2deg);opacity:.9}}
.lantern.drift{bottom:-90px;pointer-events:auto;animation:loop var(--d,26s) linear var(--dl,0s) infinite}
.lantern.drift:hover{filter:brightness(1.12)}
@keyframes loop{0%{transform:translate(0,0) rotate(-3deg)}25%{transform:translate(16px,-32vh) rotate(3deg)}50%{transform:translate(-12px,-64vh) rotate(-2deg)}75%{transform:translate(14px,-96vh) rotate(3deg)}100%{transform:translate(-6px,-130vh) rotate(-2deg)}}
.legend{display:flex;gap:16px;justify-content:center;align-items:center;font-size:.86rem;color:var(--muted);margin:.15rem 0 .65rem}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:6px;vertical-align:-1px;background:linear-gradient(180deg,#ffe0a8,#ff9d63);box-shadow:0 0 8px rgba(255,170,90,.6)}
.legend i.hers{background:linear-gradient(180deg,#ffd6e6,#f2689a);box-shadow:0 0 8px rgba(255,110,160,.6)}
.who{margin:0 0 .55rem;font-family:var(--sans);font-size:.74rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.who.his{color:#b86518}.who.hers{color:#b8346a}
.editfield{width:100%;min-height:120px;border-radius:12px;border:1px solid rgba(58,42,42,.25);background:#fffdf9;color:var(--ink);padding:.75rem .9rem;font:inherit;font-size:1.05rem;line-height:1.5;resize:none}
.notecard{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:rgba(12,6,16,.76);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:enter .3s ease both;overflow:auto}
.notecard .paper{max-width:420px;width:100%}

/* tilt to peek: holographic parallax cards */
.holo{--w:min(280px,72vw);position:relative;width:var(--w);height:calc(var(--w) * 1.2);margin:.9rem auto .6rem;touch-action:none;user-select:none;-webkit-user-select:none}
.hslot{position:absolute;inset:0;perspective:900px;transform-style:preserve-3d}
.hslot.in-r{animation:hinr .42s cubic-bezier(.22,1,.36,1) both}
.hslot.in-l{animation:hinl .42s cubic-bezier(.22,1,.36,1) both}
.hslot.out-l{animation:houtl .38s ease-in both;pointer-events:none}
.hslot.out-r{animation:houtr .38s ease-in both;pointer-events:none}
@keyframes hinr{from{transform:translateX(70%) rotate(9deg);opacity:0}to{transform:none;opacity:1}}
@keyframes hinl{from{transform:translateX(-70%) rotate(-9deg);opacity:0}to{transform:none;opacity:1}}
@keyframes houtl{to{transform:translateX(-70%) rotate(-9deg);opacity:0}}
@keyframes houtr{to{transform:translateX(70%) rotate(9deg);opacity:0}}
.hcard{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(calc(var(--ty,0) * -12deg)) rotateY(calc(var(--tx,0) * 12deg));will-change:transform}
.hback,.hphoto,.hsheen,.hglare,.hcap,.hsp{position:absolute}
.hback{inset:0;border-radius:18px;overflow:hidden;background:#1d1220;box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,220,180,.28);transform:translate3d(calc(var(--tx,0) * -8px),calc(var(--ty,0) * -8px),-30px) scale(1.06)}
.hback img{width:100%;height:100%;object-fit:cover;filter:blur(16px) brightness(.55) saturate(1.3);transform:scale(1.25)}
.hphoto{inset:14px 14px 70px 14px;border-radius:10px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.55);transform:translate3d(calc(var(--tx,0) * 6px),calc(var(--ty,0) * 6px),10px)}
.hphoto img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.hsheen,.hglare{inset:14px 14px 70px 14px;border-radius:10px;pointer-events:none}

/* a soft scrollbar drawn by hand, so it looks the same on every phone and can be dragged */
function softScrollbar(sc, host) {
  const bar = el('div', { class: 'sbar', 'aria-hidden': 'true' }), thumb = el('div', { class: 'sthumb' }); bar.append(thumb); host.append(bar);
  let hideT = 0;
  const update = () => {
    const sh = sc.scrollHeight, ch = sc.clientHeight;
    if (sh <= ch + 2) { bar.classList.remove('can', 'on'); return false; }
    bar.classList.add('can');
    const trackH = bar.clientHeight || ch - 28, th = Math.max(36, trackH * ch / sh), maxTop = Math.max(0, trackH - th);
    thumb.style.height = th + 'px'; thumb.style.transform = 'translateY(' + ((sc.scrollTop / (sh - ch)) * maxTop).toFixed(1) + 'px)';
    return true;
  };
  const poke = () => { if (update()) { bar.classList.add('on'); clearTimeout(hideT); hideT = setTimeout(() => bar.classList.remove('on'), 1500); } };
  sc.addEventListener('scroll', poke, { passive: true });
  thumb.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    try { thumb.setPointerCapture(e.pointerId); } catch (err) {}
    const y0 = e.clientY, top0 = sc.scrollTop;
    const move = (ev) => { const trackH = bar.clientHeight, th = thumb.offsetHeight, ratio = (sc.scrollHeight - sc.clientHeight) / Math.max(1, trackH - th); sc.scrollTop = top0 + (ev.clientY - y0) * ratio; };
    const up = () => { thumb.removeEventListener('pointermove', move); thumb.removeEventListener('pointerup', up); thumb.removeEventListener('pointercancel', up); };
    thumb.addEventListener('pointermove', move); thumb.addEventListener('pointerup', up); thumb.addEventListener('pointercancel', up);
  });
  thumb.addEventListener('click', (e) => e.stopPropagation());
  return { poke };
}

/* a letter on a fixed-size sheet. Each tap reveals one line, and it keeps going by itself too. */
function typedPaper(lines, label, api, signText) {
  const paper = el('div', { class: 'paper typed' });
  const sc = el('div', { class: 'paper-scroll', tabindex: '0', role: 'article', 'aria-label': label, 'aria-live': 'off' }); paper.append(sc);
  const bar = softScrollbar(sc, paper);
  let idx = 0, cur = null, waiting = false, finished = false, timer = 0;
  const scrollTo = (top) => { if (sc.scrollTo) sc.scrollTo({ top, behavior: reduce ? 'auto' : 'smooth' }); else sc.scrollTop = top; };
  const showLine = (p) => {
    const bottom = p.offsetTop + p.offsetHeight + 24, tall = p.offsetHeight > sc.clientHeight - 56;
    scrollTo(tall ? Math.max(0, p.offsetTop - 24) : Math.max(0, bottom - sc.clientHeight)); bar.poke();
  };
  const finishAll = () => {
    if (finished) return; finished = true; cur = null; waiting = false; clearTimeout(timer);
    if (signText) { sc.append(el('p', { class: 'sign', text: signText })); scrollTo(sc.scrollHeight); bar.poke(); }
    api.ready();
  };
  const startNext = (instant) => {
    waiting = false; clearTimeout(timer);
    if (finished) return;
    if (idx >= lines.length) { finishAll(); return; }
    const text = lines[idx++], chars = Array.from(text);
    const p = el('p'), shown = el('span'), rest = el('span', { class: 'ghost', text });
    p.append(shown, rest); sc.append(p); showLine(p);

    const done = () => {
      clearTimeout(t); shown.textContent = text; rest.remove(); cur = null;
      if (idx >= lines.length) { finishAll(); return; }
      waiting = true; timer = setTimeout(() => startNext(false), reduce ? 0 : 1000);
    };
    cur = { skip: done };
    if (reduce || instant) { done(); return; }
    const tick = () => {
      k++; shown.textContent = chars.slice(0, k).join(''); rest.textContent = chars.slice(k).join('');
      if (k >= chars.length) { done(); return; }
      t = setTimeout(tick, /[.,!?]/.test(chars[k - 1]) ? 240 : 26);

  });

}

  const edgeOf = (a, b) => ((a + 1) % N === b ? a : b);

    const film = (() => {
      const mk = (n) => el('div', { class: 'ffr' }, el('img', { src: P[n].src, alt: P[n].caption || '', draggable: 'false' }));
      const gate = el('div', { class: 'fgate' });
      const grain = el('canvas', { class: 'fgrain', width: 140, height: 140 }), flick = el('div', { class: 'fflick' });
      const tc = el('div', { class: 'ftc' }), num = el('span', { class: 'fnum' }), leader = el('div', { class: 'fleader' }, num);
      const screen = el('div', { class: 'fscreen', tabindex: '0', role: 'group', 'aria-label': tr('filmSmall') },
        gate, el('div', { class: 'fdust' }), el('i', { class: 'fscr' }), el('i', { class: 'fscr b' }), flick, grain, el('div', { class: 'fvig' }), tc, leader);
      const tiles = P.map((p, n) => el('button', { class: 'ft', type: 'button', 'aria-label': p.caption || ('Frame ' + (n + 1)), onclick: () => { if (!swiped) jump(n); } }, el('img', { src: p.src, alt: '', draggable: 'false' })));
      const track = el('div', { class: 'ftrack' }, tiles), wrap = el('div', { class: 'fwrap' }, track);
      const title = el('p', { class: 'ftitle', 'aria-live': 'polite' });
      const prev = el('button', { class: 'iconbtn', type: 'button', 'aria-label': tr('photoPrev'), text: '‹', onclick: () => step(-1) });
      const next = el('button', { class: 'iconbtn', type: 'button', 'aria-label': tr('photoNext'), text: '›', onclick: () => step(1) });
      const hint = el('p', { class: 'phint', 'aria-live': 'polite' });
      const panel = el('div', { class: 'ppanel' }, screen, wrap, el('div', { class: 'frow' }, N > 1 ? prev : null, title, N > 1 ? next : null), hint);
      let busy = false, started = false, swiped = false, active = false, leaderRan = false;
      const hintNow = () => { hint.textContent = S.finished ? tr('filmEnd') : tr('filmHint') + (soundOn ? '' : ' ' + tr('filmSound')); };
      const center = () => {
        const t = tiles[S.i]; if (!t || !wrap.clientWidth) return;
        track.style.transform = 'translateX(' + Math.round(wrap.clientWidth / 2 - (t.offsetLeft + t.offsetWidth / 2)) + 'px)';
      };
      const paint = (swap) => {
        tc.textContent = '▶ ' + pad2(S.i + 1) + ' / ' + pad2(N);
        tiles.forEach((t, k) => t.classList.toggle('on', k === S.i));
        title.textContent = P[S.i].caption || ''; if (swap) { title.classList.remove('swap'); void title.offsetWidth; title.classList.add('swap'); }
        center();
      };
      const clickSfx = () => { tick(1.3, 1500); later(() => tick(0.8, 3400), 55); vib(8); };
      const show = (n, dir) => {
        if (busy || !started || N < 2) return; busy = true;
        const old = gate.lastElementChild, nf = mk(n);
        nf.classList.add(dir > 0 ? 'from-b' : 'from-t'); gate.append(nf); old.classList.add(dir > 0 ? 'to-t' : 'to-b');
        clickSfx(); screen.classList.remove('jolt'); void screen.offsetWidth; screen.classList.add('jolt');
        S.i = n; setGlow(n); paint(true); mark(n); hintNow();
        later(() => { old.remove(); nf.classList.remove('from-b', 'from-t'); nf.classList.add('settle'); busy = false; }, 310);
        later(() => nf.classList.remove('settle'), 640);
      };
      const step = (d) => show((S.i + d + N) % N, d);
      const jump = (n) => { if (n !== S.i) show(n, n > S.i ? 1 : -1); };
      let sx = 0, sy = 0, dn = false, tgtEl = null;
      const down = (e) => { dn = true; sx = e.clientX; sy = e.clientY; tgtEl = e.currentTarget; };
      const up = (e) => {
        if (!dn) return; dn = false; const dx = e.clientX - sx, dy = e.clientY - sy;
        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { swiped = true; setTimeout(() => { swiped = false; }, 250); step(dx < 0 ? 1 : -1); }
        else if (tgtEl === screen && Math.hypot(dx, dy) < 10) { if (!started) startFilm(); else step(1); }
      };
      [screen, wrap].forEach((n) => { n.addEventListener('pointerdown', down); n.addEventListener('pointerup', up); n.addEventListener('pointercancel', () => { dn = false; }); });
      screen.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!started) startFilm(); else step(1); } });

      const gctx = grain.getContext('2d'), gimg = gctx.createImageData(140, 140);
      const noise = () => { if (!active) return; const d = gimg.data; for (let k = 0; k < d.length; k += 4) { const v = (Math.random() * 255) | 0; d[k] = d[k + 1] = d[k + 2] = v; d[k + 3] = 255; } gctx.putImageData(gimg, 0, 0); };
      noise(); if (!reduce) ints.push(setInterval(noise, 90));
      const blink = () => { if (dead) return; if (active) { flick.classList.add('big'); later(() => flick.classList.remove('big'), 110); } later(blink, 2400 + Math.random() * 3200); };
      if (!reduce) later(blink, 2500);

      function startFilm() {
        if (started) return; started = true; leader.classList.add('gone'); screen.classList.add('rise');
        tick(1.4, 1100); later(() => tick(0.8, 3000), 60); later(() => screen.classList.remove('rise'), 950); paint(false);
      }
      const sync = (n) => { S.i = n; gate.textContent = ''; gate.append(mk(n)); busy = false; paint(false); };
      sync(0);
      return {
        panel, hintNow,
        activate: () => {
          active = true; sync(S.i); hintNow(); noise();
          if (!leaderRan) {
            leaderRan = true;
            ['3', '2', '1'].forEach((n, k) => later(() => { if (started) return; num.textContent = n; num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop'); tick(1, 900); chime(k + 3); }, 250 + k * 520));
            later(startFilm, 250 + 3 * 520 + 150);
          }
          later(center, 60);
        },
        deactivate: () => { active = false; },
        center,
      };
    })();

    /* ================= switcher ================= */
    const small = el('p', { class: 'small' });
    const bT = el('button', { class: 'pm', type: 'button', role: 'tab', text: tr('modeTilt'), onclick: () => setMode('tilt') });
    const bF = el('button', { class: 'pm', type: 'button', role: 'tab', text: tr('modeFilm'), onclick: () => setMode('film') });
    const pmode = el('div', { class: 'pmode', role: 'tablist', 'aria-label': tr('modeLabel') }, bT, bF);
    const modes = { tilt, film };
    const setMode = (m, first) => {
      if (!first && m === S.mode) return;
      const prevM = modes[S.mode]; if (!first && prevM) { prevM.deactivate(); prevM.panel.hidden = true; }
      S.mode = m; window.__wlMode = m;
      const cur = modes[m]; cur.panel.hidden = false; cur.panel.style.animation = 'none'; void cur.panel.offsetWidth; cur.panel.style.animation = '';
      bT.classList.toggle('on', m === 'tilt'); bF.classList.toggle('on', m === 'film');
      bT.setAttribute('aria-selected', m === 'tilt'); bF.setAttribute('aria-selected', m === 'film');
      small.textContent = tr(m === 'tilt' ? 'holoSmall' : 'filmSmall'); chime(m === 'tilt' ? 4 : 2); vib(8);
      cur.activate();
    };
    root.append(pmode, el('h2', { text: tr('photosH') }), small, tilt.panel, film.panel);
    film.panel.hidden = true;
    setMode(window.__wlMode === 'film' ? 'film' : 'tilt', true);
    if (N === 1) { S.finished = true; api.ready(); }
    const onRes = () => film.center(); window.addEventListener('resize', onRes);
    return () => { dead = true; timers.forEach(clearTimeout); ints.forEach(clearInterval); window.removeEventListener('resize', onRes); tilt.destroy(); };
  });
}

add('balloons', (root, api) => {
  const P = tr('proms'), COL = ['#ff8aa8', '#ffb36b', '#c9a7ff', '#7fd0c4', '#ffd36b', '#8fb4ff'];
  root.append(el('h2', { text: tr('promH') }), el('p', { class: 'small', text: tr('promSmall') }));
  const grid = el('div', { class: 'balloons' }), card = el('p', { class: 'pcard', 'aria-live': 'polite' });
  let popped = 0;
  P.forEach((txt, i) => {
    const b = el('button', { class: 'balloon', type: 'button', 'aria-label': tr('balloon', { n: i + 1, t: P.length }) }); b.style.setProperty('--c', COL[i % COL.length]); b.style.setProperty('--dl', (-i * 0.55) + 's');
    b.addEventListener('click', () => {
      if (b.classList.contains('pop')) return;
      const from = centerOf(b);
      burst(from.x, from.y); chime(i); vib(18);
      b.classList.add('pop'); b.disabled = true; popped++;
      card.textContent = txt; emerge(card, from, 900);
      if (popped === P.length) wait(() => { card.textContent = tr('promEnd'); emerge(card, null); api.ready(); }, 5200);
    });

add('hug', (root, api) => {
  root.append(el('h2', { text: tr('hugH') }), el('p', { class: 'small', text: tr('hugSmall') }));
  const R = 54, C = 2 * Math.PI * R, wrap = el('div', { class: 'hugwrap' });
  wrap.innerHTML = '<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="ring-bg" cx="60" cy="60" r="54"/><circle class="ring" cx="60" cy="60" r="54" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + C.toFixed(2) + '"/></svg>';
  const btn = el('button', { class: 'hugbtn', type: 'button', 'aria-label': tr('hugAria'), text: '🤍' }); wrap.append(btn);
  const ring = wrap.querySelector('.ring'), note = el('p', { class: 'pcard', style: 'height:5.2rem' });
  let p = 0, held = false, raf = 0, last = 0, vt = 0, done = false;
  const finish = () => {
    done = true; held = false; wrap.classList.remove('holding'); ring.style.strokeDashoffset = '0'; btn.style.transform = ''; wrap.classList.add('bloom'); chime(5); vib([40, 60, 40, 60, 80]);
    note.textContent = tr('hugDone'); emerge(note, centerOf(btn), 1000); api.ready();
  };
  const loop = (ts) => {
    const dt = Math.min(64, last ? ts - last : 16); last = ts;
    p += held ? dt / 1700 : -dt / 800; p = Math.max(0, Math.min(1, p));
    ring.style.strokeDashoffset = (C * (1 - p)).toFixed(2); btn.style.transform = 'scale(' + (1 + p * 0.16).toFixed(3) + ')';
    if (held && ts - vt > 450) { vt = ts; vib(10); }
    if (p >= 1) { finish(); raf = 0; return; }
    if (held || p > 0) raf = requestAnimationFrame(loop); else { raf = 0; last = 0; }
  };
  const start = () => { if (done) return; held = true; wrap.classList.add('holding'); if (!raf) { last = 0; raf = requestAnimationFrame(loop); } };
  const stop = () => { held = false; wrap.classList.remove('holding'); };
  btn.addEventListener('pointerdown', (e) => { e.preventDefault(); start(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => btn.addEventListener(ev, stop));
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
  btn.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); start(); } });
  btn.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') stop(); });
  root.append(wrap, note);
  return () => { if (raf) cancelAnimationFrame(raf); };
});

/* ───────── frame ───────── */
const stage = $('#stage'), nextBtn = $('#next'), backBtn = $('#back'), nav = $('#nav'), dots = $('#dots');
let cur = -1, cleanup = null, busy = false, fitRO = null;
function fit() {
  const f = stage.firstElementChild; if (!f) return;
  const cs = getComputedStyle(stage), availH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (!(availH > 0)) return;
  const need = f.offsetHeight;
  let s = need > availH ? availH / need : 1;
  const tooSmall = s < 0.5; if (tooSmall) s = 0.5;
  f.style.transform = s < 1 ? 'scale(' + s.toFixed(4) + ')' : '';
  stage.style.overflowY = tooSmall ? 'auto' : 'hidden';
}
window.addEventListener('resize', () => fit());
function leave() { stopMic(); try { if (window.opener) { window.close(); } } catch (e) {} setTimeout(() => { location.href = 'index.html'; }, 120); }
function markReady() { nextBtn.classList.add('pulse'); }
function updateNav() {
  const first = cur === 0, last = cur === SCENES.length - 1, hide = first || last;
  nav.style.display = hide ? 'none' : 'flex'; document.body.classList.toggle('nonav', hide);
  backBtn.style.visibility = cur <= 1 ? 'hidden' : 'visible';
  nextBtn.classList.remove('pulse');
  dots.querySelectorAll('i').forEach((d, i) => { d.className = i === cur ? 'on' : i < cur ? 'past' : ''; });
}
function go(n) {
  if (busy || n < 0 || n >= SCENES.length) return;
  busy = true;
  const old = stage.firstElementChild;
  const swap = () => {
    if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
    if (fitRO) { fitRO.disconnect(); fitRO = null; }
    stage.textContent = ''; stage.style.overflowY = 'hidden'; cur = n;
    const sc = el('section', { class: 'scene', 'data-scene': SCENES[n].id }), f = el('div', { class: 'fit' }, sc); stage.append(f); updateNav();
    try { cleanup = SCENES[n].render(sc, { ready: markReady, go: (i) => go(i) }) || null; }
    catch (e) { console.error(e); sc.append(el('p', { class: 'lead', text: tr('oops') })); markReady(); }
    fit(); requestAnimationFrame(fit);
    if (window.ResizeObserver) { fitRO = new ResizeObserver(() => fit()); fitRO.observe(f); }
    busy = false;
  };
  if (old && !reduce) { const s = old.firstElementChild; if (s) s.classList.add('out'); setTimeout(swap, 240); } else swap();
}
nextBtn.addEventListener('click', () => go(cur + 1));
backBtn.addEventListener('click', () => go(cur - 1));
$('#exit').addEventListener('click', leave);
$('#snd').addEventListener('click', () => setSound(!soundOn));
document.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;
  if (e.key === 'ArrowRight' && cur > 0 && cur < SCENES.length - 1) go(cur + 1);
  if (e.key === 'ArrowLeft' && cur > 1) go(cur - 1);
  if (e.key === 'Escape') { const c = $('.notecard'); if (c) c.remove(); }
});

document.addEventListener('pointerdown', (e) => {
  if (reduce || (e.target.closest && e.target.closest('canvas,textarea,input,.constel,.paper'))) return;
  for (let i = 0; i < 4; i++) {
    const n = el('i', { class: 'spark' }), a = Math.random() * 6.283, d = 18 + Math.random() * 26;
    n.style.left = e.clientX + 'px'; n.style.top = e.clientY + 'px';
    n.style.setProperty('--dx', Math.cos(a) * d + 'px'); n.style.setProperty('--dy', Math.sin(a) * d + 'px'); n.style.setProperty('--rot', '0deg');
    document.body.append(n); setTimeout(() => n.remove(), 950);
  }
});

/* ───────── start ───────── */
SCENES.forEach(() => dots.append(el('i')));
nextBtn.textContent = tr('next'); backBtn.textContent = tr('back'); $('#exit').setAttribute('aria-label', tr('exit')); paintSoundBtn();
go(0);
})();
