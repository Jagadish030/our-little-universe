<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a0f1c">
<title>Our Little Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1a24;--cream:#fff3e6;--gold:#ffd9a0;--rose:#ff9aa8;--glass:rgba(34,20,38,.58);--glass-b:rgba(255,220,180,.28);--serif:'Playfair Display',Georgia,serif;--sans:'Quicksand',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1a0f1c;color:var(--cream);font-family:var(--sans);overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.hidden{display:none!important}
.glass{background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none;z-index:10}
#top>*{pointer-events:auto}
.rbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--cream);font-size:1.25rem;text-decoration:none;border:1px solid var(--glass-b);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;font-family:var(--sans)}
#roomName{padding:.5rem 1.1rem;border-radius:999px;font-family:var(--serif);font-style:italic;font-size:1.05rem;white-space:nowrap;transition:opacity .4s}
#menu{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:11;padding:.4rem;border-radius:18px;display:grid;gap:2px;min-width:200px}
#menu button{border:0;background:transparent;color:var(--cream);padding:.7rem .9rem;text-align:left;border-radius:12px;font:600 .95rem var(--sans);cursor:pointer}
#menu button:active{background:rgba(255,255,255,.12)}
#joy{position:fixed;left:calc(env(safe-area-inset-left,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:132px;height:132px;border-radius:50%;z-index:9;touch-action:none;background:rgba(34,20,38,.35);border:1px solid var(--glass-b)}
#joy.run{box-shadow:0 0 0 3px rgba(255,177,153,.55),0 0 26px rgba(255,152,163,.5)}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:linear-gradient(135deg,#ffe2ad,#ffb199 55%,#ff98a3);box-shadow:0 6px 18px rgba(0,0,0,.4)}
#act{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);transform:translateX(-50%);z-index:9;max-width:min(78vw,380px);padding:.8rem 1.4rem;border-radius:999px;border:0;font:700 1rem var(--sans);color:#281424;background:linear-gradient(135deg,#ffe2ad,#ffb199 55%,#ff98a3);box-shadow:0 8px 26px rgba(255,150,120,.4);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 72px);transform:translateX(-50%);z-index:8;padding:.55rem 1rem;border-radius:999px;font-size:.88rem;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s;max-width:90vw}
#hint.on{opacity:1}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%) translateY(10px);z-index:30;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;text-align:center;max-width:88vw}
#toast.on{opacity:1;transform:translateX(-50%)}
#loader,#gate{position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 35%,#3a2140,#160c18 70%)}
#loader p,#gate p{margin:.4rem 0;color:rgba(255,243,230,.8)}
#loader h1,#gate h1{margin:0 0 .3rem;font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.9rem;color:var(--cream)}
.spark{display:inline-block;font-size:2rem;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25);opacity:.7}}
.bar{width:min(240px,60vw);height:4px;border-radius:4px;background:rgba(255,255,255,.14);margin:1rem auto 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe2ad,#ff98a3);transition:width .3s}
.pbtn{margin-top:1rem;padding:.8rem 1.6rem;border:0;border-radius:999px;font:700 1rem var(--sans);color:#281424;background:linear-gradient(135deg,#ffe2ad,#ffb199 55%,#ff98a3);cursor:pointer;text-decoration:none;display:inline-block}
.pbtn.ghost{background:transparent;color:var(--cream);border:1px solid var(--glass-b)}
#viewer{position:fixed;inset:0;z-index:25;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);background:rgba(14,7,16,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.vbox{width:min(94vw,560px);max-height:100%;display:flex;flex-direction:column;align-items:center;gap:.7rem;animation:vin .35s cubic-bezier(.22,1,.36,1) both}
@keyframes vin{from{opacity:0;transform:scale(.94) translateY(10px)}}
.vmedia{width:100%;display:grid;place-items:center;min-height:120px}
.vmedia img,.vmedia video{max-width:100%;max-height:62vh;border-radius:8px;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.55)}
.vmedia video{background:#000}
.vcap{width:100%;text-align:center;padding:.2rem .6rem}
.vcap h3{margin:0;font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.4rem}
.vcap .sub{margin:.2rem 0 0;color:rgba(255,243,230,.65);font-size:.9rem}
.vcap .reply{margin:.6rem auto 0;padding:.6rem .9rem;border-radius:14px;max-width:92%;background:rgba(255,255,255,.08);font-size:.95rem;text-align:left}
.vrow{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.vrow button{min-width:44px;height:44px;padding:0 1rem;border-radius:999px;border:1px solid var(--glass-b);background:var(--glass);color:var(--cream);font:700 .95rem var(--sans);cursor:pointer}
.vnote{width:min(88vw,380px);padding:1.5rem 1.4rem 1.2rem;border-radius:6px;color:#3b2a2a;font-family:'Caveat',cursive;font-size:1.65rem;line-height:1.25;box-shadow:0 20px 50px rgba(0,0,0,.5);text-align:left;white-space:pre-wrap;max-height:60vh;overflow:auto;user-select:text;-webkit-user-select:text}
.vnote .rp{display:block;margin-top:.9rem;padding-top:.7rem;border-top:1px dashed rgba(0,0,0,.25);color:#a2455a}
.vnote .sg{display:block;margin-top:.6rem;text-align:right;font-size:1.3rem;opacity:.8}
.vlock{width:min(86vw,340px);padding:1.6rem 1.2rem;text-align:center;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid var(--glass-b)}
.vlock b{display:block;font-size:2.4rem;margin-bottom:.4rem}
#passcode{position:fixed;inset:0;z-index:35;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 30%,rgba(58,33,64,.96),rgba(18,9,20,.97) 72%)}
.pcard{width:min(92vw,360px);padding:1.6rem 1.3rem 1.3rem;border-radius:26px;text-align:center;position:relative}
.pcard h2{margin:.2rem 0 .1rem;font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.7rem}
.pcard .lock{font-size:2.2rem;animation:pulse 2.4s ease-in-out infinite}
.pcard p{margin:.2rem 0 .8rem;color:rgba(255,243,230,.72);font-size:.92rem}
.ident{display:flex;gap:10px;justify-content:center;margin-bottom:.8rem}
.ident button{width:64px;height:64px;border-radius:50%;border:1px solid var(--glass-b);background:rgba(255,255,255,.06);color:var(--cream);font:700 1.3rem var(--serif);cursor:pointer}
.ident button.on{background:linear-gradient(135deg,#ffe2ad,#ffb199 55%,#ff98a3);color:#281424;border-color:transparent}
.pcard input{width:100%;padding:.85rem 1rem;border-radius:14px;border:1px solid var(--glass-b);background:rgba(255,255,255,.08);color:var(--cream);font:600 1rem var(--sans);text-align:center;outline:none;user-select:text;-webkit-user-select:text}
.perr{min-height:1.3em;margin:.5rem 0 0;color:#ffb3b3;font-size:.85rem}

body.touch #act,body.touch #act2{max-width:calc(100vw - 160px)}
body.touch #act{bottom:calc(env(safe-area-inset-bottom,0px) + 184px)}
body.touch #act2{bottom:calc(env(safe-area-inset-bottom,0px) + 238px)}
body.touch #toast{bottom:calc(env(safe-area-inset-bottom,0px) + 300px)}
#act2{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 88px);transform:translateX(-50%);z-index:9;max-width:min(78vw,380px);padding:.65rem 1.2rem;border-radius:999px;font:700 .95rem var(--sans);color:var(--cream);background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;white-space:nowrap}
#side{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);z-index:9;display:flex;flex-direction:column-reverse;gap:10px}
#side .rbtn.off{opacity:.55}
#map{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 62px);width:168px;height:246px;z-index:9;border-radius:16px;background:rgba(24,13,28,.82);border:1px solid var(--glass-b);backdrop-filter:blur(8px)}
#emotes{position:fixed;right:calc(env(safe-area-inset-right,0px) + 70px);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);z-index:12;padding:.45rem;border-radius:20px;display:grid;grid-template-columns:repeat(4,48px);gap:6px;max-height:58vh;overflow-y:auto;touch-action:pan-y}
#emotes button{width:48px;height:48px;border:0;border-radius:14px;background:rgba(255,255,255,.08);font-size:1.5rem;cursor:pointer}
#emotes button:active{background:rgba(255,255,255,.2)}
#heartChip{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:8;padding:.35rem .8rem;border-radius:999px;font:700 .85rem var(--sans)}
#map:not(.hidden) ~ #heartChip{top:calc(env(safe-area-inset-top,0px) + 320px)}
#capChip{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);z-index:8;max-width:86vw;padding:.7rem 1.2rem;border-radius:18px;text-align:center;font-family:var(--serif);font-style:italic;font-size:1.1rem;pointer-events:none}
#capChip small{display:block;font:600 .78rem var(--sans);opacity:.7;margin-top:.15rem;font-style:normal}
body.touch #capChip{bottom:calc(env(safe-area-inset-bottom,0px) + 300px)}
#flare{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 46%,rgba(255,236,200,.95),rgba(255,200,150,.45) 38%,rgba(255,170,140,0) 72%)}
#flare.go{animation:flare .95s ease-out}
@keyframes flare{0%{opacity:0}22%{opacity:.62}100%{opacity:0}}
#photoUI{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:12;display:flex;align-items:center;justify-content:center;gap:14px;pointer-events:none}
#photoUI>*{pointer-events:auto}
#shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.25);cursor:pointer}
#shutter:active{background:rgba(255,255,255,.7)}
#photoUI .rbtn{width:50px;height:50px}
#count{position:fixed;inset:0;z-index:13;display:grid;place-items:center;pointer-events:none;font:italic 600 9rem var(--serif);color:#fff;text-shadow:0 0 40px rgba(255,200,150,.8)}
.overlay{position:fixed;inset:0;z-index:26;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);background:rgba(14,7,16,.84);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sheet{width:min(94vw,440px);max-height:100%;display:flex;flex-direction:column;gap:.7rem;padding:1.1rem;border-radius:24px;animation:vin .35s cubic-bezier(.22,1,.36,1) both}
.sheet h2{margin:0;font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.5rem;text-align:center}
.sheet img.snap{width:100%;max-height:52vh;object-fit:contain;border-radius:12px;background:#000}
.sheet input,.sheet textarea{width:100%;padding:.8rem 1rem;border-radius:14px;border:1px solid var(--glass-b);background:rgba(255,255,255,.08);color:var(--cream);font:600 1rem var(--sans);outline:none;user-select:text;-webkit-user-select:text}
.sheet textarea{min-height:76px;resize:none;font-family:'Caveat',cursive;font-size:1.35rem}
.srow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.gbook{overflow:auto;display:grid;gap:.6rem;max-height:46vh;padding:.2rem}
.gentry{padding:.7rem .9rem;border-radius:14px;background:rgba(255,248,235,.94);color:#3b2a2a}
.gentry p{margin:0;font-family:'Caveat',cursive;font-size:1.45rem;line-height:1.15;white-space:pre-wrap;word-break:break-word}
.gentry .gmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:.3rem;font-size:.75rem;opacity:.7}
.gentry img.sig{height:34px;max-width:50%;object-fit:contain}
.gentry b{font-family:'Caveat',cursive;font-size:1.3rem}

#chatBtn{position:relative}
#chatBadge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#ff5d7a;color:#fff;font:700 .68rem/18px var(--sans);text-align:center}
#chat{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateX(-50%);z-index:14;width:min(95vw,430px);height:min(52vh,420px);display:flex;flex-direction:column;border-radius:22px;padding:.6rem .7rem .7rem;background:rgba(20,10,24,.9);border:1px solid var(--glass-b);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#chat header{display:flex;align-items:center;justify-content:space-between;padding:0 .2rem .4rem;font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.15rem}
#chat header button{border:0;background:transparent;color:var(--cream);font-size:1.2rem;width:36px;height:36px;border-radius:50%;cursor:pointer}
#chatList{flex:1;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:.4rem;padding:.2rem .1rem}
.cmsg{max-width:82%;padding:.45rem .75rem;border-radius:16px;font-size:.95rem;line-height:1.25;word-break:break-word;user-select:text;-webkit-user-select:text}
.cmsg small{display:block;opacity:.55;font-size:.66rem;margin-top:.1rem}
.cmsg.me{align-self:flex-end;background:linear-gradient(135deg,#ffe2ad,#ffb199 55%,#ff98a3);color:#281424;border-bottom-right-radius:5px}
.cmsg.them{align-self:flex-start;background:rgba(255,255,255,.12);border-bottom-left-radius:5px}
.cmsg.quick{font-weight:700}
#chatNote{margin:.2rem .3rem;font-size:.72rem;opacity:.6;min-height:1em}
#chatQuick{display:flex;gap:6px;overflow-x:auto;touch-action:pan-x;padding:.3rem .1rem .45rem;scrollbar-width:none}
#chatQuick::-webkit-scrollbar{display:none}
#chatQuick button{flex:none;border:1px solid var(--glass-b);background:rgba(255,255,255,.07);color:var(--cream);border-radius:999px;padding:.42rem .8rem;font:700 .82rem var(--sans);cursor:pointer;white-space:nowrap}
#chatQuick button:active{background:rgba(255,255,255,.2)}
#chatForm{display:flex;gap:8px}
#chatInput{flex:1;min-width:0;padding:.7rem .9rem;border-radius:14px;border:1px solid var(--glass-b);background:rgba(255,255,255,.08);color:var(--cream);font:600 1rem var(--sans);outline:none;user-select:text;-webkit-user-select:text}
#chatSend{border:0;border-radius:14px;padding:0 1rem;font:700 .95rem var(--sans);color:#281424;background:linear-gradient(135deg,#ffe2ad,#ffb199 55%,#ff98a3);cursor:pointer}
body.chat-open #joy,body.chat-open #act,body.chat-open #act2,body.chat-open #side,body.chat-open #capChip{display:none!important}
#dbg{position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 120px);z-index:50;padding:.3rem .5rem;border-radius:8px;background:rgba(0,0,0,.65);font:600 .68rem/1.35 ui-monospace,Menlo,monospace;white-space:pre;pointer-events:none}
.emx{grid-column:span 4;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:300px}
.emx button{width:42px;height:42px;font-size:1.3rem;border:0;border-radius:12px;background:rgba(255,255,255,.08);cursor:pointer}
#wtBar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:12;display:none;align-items:center;gap:10px;padding:.45rem .6rem;border-radius:999px;transition:opacity .6s}
#wtBar .rbtn{width:52px;height:52px;font-size:1.3rem}
#wtBar.dim{opacity:.28}
body.cinema #wtBar{display:flex}
body.cinema #top,body.cinema #side,body.cinema #joy,body.cinema #act,body.cinema #act2,body.cinema #heartChip,body.cinema #map,body.cinema #emotes,body.cinema #menu,body.cinema #capChip,body.cinema #hint{display:none!important}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<div id="top" class="hidden">
  <a class="rbtn" id="backBtn" href="index.html" aria-label="Back to home">←</a>
  <div id="roomName" class="glass">Lobby</div>
  <button class="rbtn" id="menuBtn" aria-label="Rooms" aria-expanded="false">☰</button>
</div>
<div id="menu" class="glass hidden" role="menu"></div>
<div id="hint" class="glass"></div>
<div id="joy" class="hidden"><div id="knob"></div></div>
<button id="act" class="hidden" type="button"></button>
<div id="toast" class="glass"></div>

<div id="loader">
  <div>
    <div class="spark">✦</div>
    <h1>Our Little Gallery</h1>
    <p id="loadMsg">Lighting the lamps…</p>
    <div class="bar"><i id="loadBar"></i></div>
  </div>
</div>

<div id="gate" class="hidden">
  <div>
    <div class="spark">🔒</div>
    <h1 id="gateTitle">One step first</h1>
    <p id="gateMsg"></p>
    <a class="pbtn" href="index.html">Go to the site</a>
  </div>
</div>


<div id="flare"></div>
<div id="side" class="hidden">
  <button class="rbtn" id="mapBtn" aria-label="Map" type="button">🗺</button>
  <button class="rbtn" id="musicBtn" aria-label="Music on or off" type="button">🎵</button>
  <button class="rbtn" id="emoteBtn" aria-label="Emotes" type="button">😊</button>
  <button class="rbtn" id="chatBtn" aria-label="Chat" type="button">💬<span id="chatBadge" class="hidden">0</span></button>
  <button class="rbtn" id="photoBtn" aria-label="Photo mode" type="button">📸</button>
</div>
<canvas id="map" class="hidden" width="300" height="440"></canvas>
<div id="emotes" class="glass hidden"></div>
<div id="heartChip" class="glass hidden">💗 0/6</div>
<div id="capChip" class="glass hidden"></div>
<button id="act2" class="hidden" type="button"></button>
<div id="photoUI" class="hidden">
  <button class="rbtn" id="pmExit" type="button" aria-label="Exit photo mode">✕</button>
  <button id="shutter" type="button" aria-label="Take photo"></button>
  <button class="rbtn" id="pmFace" type="button" aria-label="Face the camera">🙂</button>
  <button class="rbtn" id="pmPose" type="button" aria-label="Pose">😊</button>
</div>
<div id="count" class="hidden"></div>
<div id="wtBar" class="glass" role="group" aria-label="Slideshow controls">
  <button class="rbtn" id="wtPrev" type="button" aria-label="Previous picture">⏮</button>
  <button class="rbtn" id="wtPlay" type="button" aria-label="Pause or play">⏸</button>
  <button class="rbtn" id="wtNext" type="button" aria-label="Next picture">⏭</button>
  <button class="rbtn" id="wtStop" type="button" aria-label="Stop the slideshow">⏹</button>
</div>

<div id="chat" class="hidden" role="dialog" aria-label="Chat">
  <header><span>💬 Chat</span><button id="chatClose" type="button" aria-label="Close chat">✕</button></header>
  <div id="chatList"></div>
  <div id="chatNote"></div>
  <div id="chatQuick"></div>
  <form id="chatForm" autocomplete="off"><input id="chatInput" maxlength="120" placeholder="Type a message…" enterkeyhint="send"><button id="chatSend" type="submit">Send</button></form>
</div>
<div id="overlay" class="overlay hidden"></div>

<div id="viewer" class="hidden" role="dialog" aria-modal="true"></div>

<div id="passcode" class="hidden">
  <form class="pcard glass" id="passForm" autocomplete="off">
    <div class="lock">🔒</div>
    <h2>Just Us</h2>
    <p>this room is only for the two of us 🤍</p>
    <div class="ident" id="ident">
      <button type="button" data-email="kavisetti2001@gmail.com" data-who="J">J</button>
      <button type="button" data-email="lalithamalavika@gmail.com" data-who="M">M</button>
