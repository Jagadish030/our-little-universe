<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#180c17">
<meta name="robots" content="noindex,nofollow">
<title>A birthday in our hearts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#180c17; --dusk:#36142d; --cream:#fff3e6; --muted:#e4cfd3;
  --gold:#ffc478; --rose:#ff9e9e; --ink:#362626;
  --glass:rgba(255,243,230,.07); --glass-border:rgba(255,220,180,.18);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --bar-h:64px; --nav-h:84px;
  --warm:0;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:var(--cream);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(130% 85% at 50% 110%,rgba(255,165,105,calc(.11 + var(--warm)*.38)) 0%,transparent 66%),
    radial-gradient(70% 50% at 82% 14%,rgba(255,215,160,calc(.04 + var(--warm)*.08)) 0%,transparent 70%),
    linear-gradient(180deg,#120814 0%,#261024 54%,#481d2d 100%)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,canvas:focus-visible,.paper-scroll:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* frame: top bar, fitted stage, bottom nav */
.bar{position:fixed;top:0;left:0;right:0;z-index:6;height:calc(var(--bar-h) + var(--sat));padding:var(--sat) 16px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;font-size:1.05rem;padding:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 4px 14px rgba(0,0,0,.22);transition:transform .2s ease,background .25s ease,border-color .25s ease}
.iconbtn:hover{background:rgba(255,243,230,.13);border-color:rgba(255,220,180,.34)}
.iconbtn:active{transform:scale(.93)}
.dots{display:flex;gap:7px;align-items:center;padding:6px 12px;border-radius:999px;background:rgba(20,10,20,.28);border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22);transition:all .45s cubic-bezier(.22,1,.36,1)}
.dots i.on{background:var(--gold);width:22px;border-radius:6px;box-shadow:0 0 10px rgba(255,196,120,.6)}
.dots i.past{background:rgba(255,207,138,.58)}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;height:calc(var(--nav-h) + var(--sab));padding:0 18px var(--sab);display:flex;align-items:center;justify-content:center;gap:12px}
#stage{position:fixed;left:0;right:0;top:calc(var(--bar-h) + var(--sat));bottom:calc(var(--nav-h) + var(--sab));z-index:2;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:6px 20px}
body.nonav #stage{bottom:var(--sab)}
.fit{flex:none;width:100%;max-width:520px;display:flex;justify-content:center;transform-origin:50% 50%}
.scene{position:relative;isolation:isolate;width:100%;text-align:center;padding:clamp(22px,5.5vw,34px) clamp(16px,4.5vw,26px);animation:enter .75s cubic-bezier(.22,1,.36,1) both}
.scene::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:28px;background:linear-gradient(180deg,rgba(255,243,230,.035) 0%,rgba(255,243,230,.09) 100%);border:1px solid rgba(255,220,180,.16);box-shadow:0 22px 60px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1)}
.scene.out{animation:leave .26s ease both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:translateY(-8px)}}

/* typography */
h1,h2{font-family:var(--serif);font-style:italic;font-weight:600;margin:.15em 0 .28em;line-height:1.1;letter-spacing:.01em;text-shadow:0 2px 18px rgba(255,190,130,.18)}
h1{font-size:clamp(2.25rem,9vw,3.45rem)}
h2{font-size:clamp(1.75rem,6.5vw,2.45rem)}
.lead{font-size:1.08rem;line-height:1.6;color:var(--cream);margin:.4rem auto;max-width:31ch}
.small{font-size:.94rem;line-height:1.6;color:var(--muted);margin:.55rem auto;max-width:35ch}
.hint{font-size:.92rem;color:var(--muted);margin:0 auto;max-width:34ch;line-height:1.55}

/* buttons & chips */
.btn{border:0;border-radius:999px;min-height:48px;padding:.8rem 1.8rem;font-weight:700;font-size:.98rem;letter-spacing:.01em;color:#281424;background:linear-gradient(135deg,#ffe2ad 0%,#ffb199 55%,#ff98a3 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 8px 26px rgba(255,150,120,.28);transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .25s ease,opacity .2s ease}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 12px 30px rgba(255,150,120,.38)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.42;cursor:default;box-shadow:none}
.btn.ghost{background:var(--glass);color:var(--cream);border:1px solid var(--glass-border);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.btn.ghost:hover:not(:disabled){background:rgba(255,243,230,.12);border-color:rgba(255,220,180,.35)}
.btn.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 8px 26px rgba(255,160,140,.24)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 8px 36px rgba(255,196,150,.65),0 0 0 5px rgba(255,196,120,.14)}}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:1.1rem}
a.btn{display:inline-grid;place-items:center;text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:.85rem 0}
.chip{border:1px solid var(--glass-border);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:.5rem 1rem;font-size:.9rem;min-height:42px;transition:background .2s ease,border-color .2s ease,transform .15s ease}
.chip:hover{background:rgba(255,243,230,.13);border-color:rgba(255,220,180,.38)}
.chip:active{transform:scale(.96)}

/* text emerging from glow */
.msg,.pcard{opacity:0}
.msg.show,.pcard.show{opacity:1}

/* cover */
.cover{position:relative;display:flex;flex-direction:column;align-items:center}
.cover::before{content:"";position:absolute;left:50%;top:30%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,207,138,.12),transparent 64%)}
.eyebrow{margin:0 0 1.5rem;font-size:.72rem;font-weight:600;letter-spacing:.38em;text-transform:uppercase;color:rgba(255,212,148,.88);animation:fadeup 1.4s ease .2s both}
@keyframes breathe{0%,100%{opacity:.22;transform:scale(.94)}50%{opacity:.88;transform:scale(1.06)}}
.cover h1{margin:1.7rem 0 .4rem;font-size:clamp(2.55rem,10vw,3.75rem);font-weight:500}
.cover .sub{margin:0 0 2.1rem;font-size:1.02rem;color:var(--muted);letter-spacing:.02em;font-family:var(--serif);font-style:italic;font-size:1.22rem}
.enter{display:inline-flex;align-items:center;min-height:50px;padding:.95rem 2.7rem;border:1px solid rgba(255,196,120,.65);border-radius:999px;background:rgba(255,196,120,.1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--gold);font-weight:600;font-size:.78rem;letter-spacing:.32em;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 28px rgba(0,0,0,.25);transition:background .3s,border-color .3s,transform .2s}
.enter:hover{background:rgba(255,207,138,.2);border-color:var(--gold);transform:translateY(-1px)}
.cover .note{max-width:38ch;margin:1.6rem auto 0;font-size:.78rem;line-height:1.6;color:rgba(227,205,208,.72)}
.linkbtn{min-height:44px;padding:.4rem .8rem;border:0;background:none;color:rgba(227,205,208,.88);font-size:.8rem;text-decoration:underline;text-underline-offset:3px}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.heartbtn{position:relative;width:min(44vw,152px);aspect-ratio:120/108;padding:0;border:0;background:none;display:block}
.heartbtn svg{display:block;width:100%;height:100%;overflow:visible}
.heart-line{fill:none;stroke:var(--gold);stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw 2.8s cubic-bezier(.5,0,.2,1) .4s forwards;filter:drop-shadow(0 0 6px rgba(255,194,122,.6))}
.heart-fill{opacity:0;transition:opacity 1.2s ease}
.cover.lit .heart-fill{opacity:1}
@keyframes draw{to{stroke-dashoffset:0}}
.heartbtn::after{content:"";position:absolute;inset:-32%;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,194,122,.26),transparent 66%);opacity:0;animation:breathe 4.6s ease-in-out 3s infinite}
.cover.lit .heartbtn::after{background:radial-gradient(circle,rgba(255,150,100,.52),transparent 66%);animation:breathe 3.2s ease-in-out infinite}
.cover.lit .heartbtn svg{animation:beat 2.4s ease-in-out 1s infinite}
.reveal{position:relative;display:flex;flex-direction:column;align-items:center}
.cover:not(.lit) .rv{visibility:hidden}
.cover.lit .rv{visibility:visible;animation:fadeup 1.3s ease var(--d,0s) both}
.lighthint{position:absolute;top:1.6rem;left:0;right:0;margin:0;font-family:var(--serif);font-style:italic;font-size:1.28rem;color:var(--gold);transition:opacity .7s;animation:fadeup 1.4s ease 3s both}
.cover.lit .lighthint{opacity:0;animation:none}
.spark{position:fixed;z-index:30;width:6px;height:6px;margin:-3px;border-radius:50%;background:radial-gradient(circle,#fff5d6,#ffb36b);pointer-events:none;animation:bit .9s ease-out forwards}
.cover.leave{transition:transform .9s cubic-bezier(.5,0,.3,1),opacity .8s ease;transform:scale(1.08);opacity:0}

/* cake and candles */
.slot{height:10.5rem;display:flex;flex-direction:column;align-items:center;width:100%}
.slot.top{justify-content:flex-end;padding-bottom:.4rem}
.slot.top>*{grid-area:auto}
.slot.bot{justify-content:center;padding-top:2rem}
.stack{position:relative;width:100%;display:grid;justify-items:center;align-items:end}
.stack>*{grid-area:1/1}
.fold{transition:opacity .9s ease}
.fold.gone{opacity:0}
.cap{opacity:0;transition:opacity 1.1s ease}
.cap.show{opacity:1}
.cap h2{margin:0 0 .25rem}
.cap .lead{margin:.1rem auto}
.cakebox{position:relative;width:100%;display:flex;justify-content:center}
.cake{position:relative;width:max(220px,min(88vw,480px,calc((100dvh - 380px) * 1.3)));aspect-ratio:300/230;transition:transform 1.7s cubic-bezier(.22,.8,.24,1)}
.cakebox.near .cake{transform:scale(var(--zoom,1.22))}
.cake>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 18px 24px rgba(0,0,0,.42)) drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.cake .glow{position:absolute;left:50%;top:-6%;width:135%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,198,122,.54) 0%,rgba(255,170,100,.14) 44%,transparent 70%);opacity:var(--g,0);transition:opacity 1.2s;pointer-events:none}
.wick{position:absolute;top:7.8%;width:7.4%;height:30.4%;margin-left:-3.7%;border:0;background:transparent;padding:0;z-index:2;display:grid;place-items:end center}
.wick svg{width:100%;height:100%;overflow:visible}
.wick .flame{opacity:0;transform-box:fill-box;transform-origin:50% 100%;transition:opacity .45s;filter:drop-shadow(0 0 6px rgba(255,195,95,.85))}
.wick.lit .flame{opacity:1;animation:flick 1.6s ease-in-out infinite;animation-delay:var(--fd,0s)}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-1.4deg)}35%{transform:scale(.94,1.08) rotate(1.6deg)}70%{transform:scale(1.04,.95) rotate(-.7deg)}}
.smoke{position:absolute;left:50%;top:6%;width:20px;height:20px;margin:-10px;border-radius:50%;background:radial-gradient(circle,rgba(236,231,242,.85),rgba(205,198,222,.38) 55%,transparent 72%);filter:blur(2px);opacity:0;pointer-events:none;animation:smoke 2.8s ease-out forwards}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:.7}100%{opacity:0;transform:translate(var(--sx),-110px) scale(2.6)}}
.meter{width:min(60vw,200px);height:6px;margin:0 auto .7rem;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;display:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.meter.live{display:block}
.meter i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#ffd98a,#ffa3b6);transition:width .09s linear}

/* constellation */
.constel{position:relative;width:min(88vw,42dvh,400px);aspect-ratio:1;margin:.2rem auto 0;touch-action:none;user-select:none;-webkit-user-select:none}
.constel svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.constel .edge{fill:none;stroke:rgba(255,207,138,.88);stroke-width:.85;stroke-linecap:round;stroke-dasharray:var(--len,30);stroke-dashoffset:var(--len,30);transition:stroke-dashoffset .6s ease;filter:drop-shadow(0 0 4px rgba(255,196,120,.5))}
.constel .edge.on{stroke-dashoffset:0}
.constel .trail{stroke:rgba(255,226,170,0);stroke-width:.9;stroke-dasharray:1.6 1.8;stroke-linecap:round}
.constel .trail.on{stroke:rgba(255,226,170,.9)}
.constel .fill{fill:rgba(255,155,179,0);transition:fill 2s}
.constel.done .fill{fill:rgba(255,155,179,.2)}
.cstar{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border:0;background:transparent;border-radius:50%;font-size:1.9rem;line-height:1;color:rgba(255,255,255,.78);text-shadow:0 0 10px rgba(255,255,255,.35);animation:twinkle 3s ease-in-out infinite;touch-action:none;transition:transform .25s ease,color .25s ease}
.cstar:nth-of-type(odd){animation-delay:-1.4s}
@keyframes twinkle{0%,100%{opacity:.7}50%{opacity:1}}
.cstar.on{color:var(--gold);animation:none;opacity:1;text-shadow:0 0 14px rgba(255,207,138,.95),0 0 32px rgba(255,170,100,.65);transform:scale(1.18)}
.cstar.start::after{content:"";position:absolute;inset:3px;border-radius:50%;border:2px solid rgba(255,207,138,.78);animation:ringp 1.6s ease-out infinite}
@keyframes ringp{from{transform:scale(.7);opacity:1}to{transform:scale(1.35);opacity:0}}
.flare{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff8d8,rgba(255,207,138,.75) 40%,transparent 70%);animation:flare .95s ease-out forwards}
@keyframes flare{from{transform:scale(.3);opacity:1}to{transform:scale(7);opacity:0}}
.msg{height:6.6rem;margin:.6rem auto 0;max-width:32ch;font-family:var(--serif);font-size:1.32rem;line-height:1.42;font-style:italic;display:flex;align-items:center;justify-content:center}
.count{font-size:.88rem;color:var(--muted);margin-top:.2rem;min-height:1.5em;letter-spacing:.03em}

/* lantern writing & floating lanterns */
.field{width:100%;min-height:112px;border-radius:18px;border:1px solid var(--glass-border);background:rgba(255,245,235,.07);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--cream);padding:.95rem 1.1rem;font:inherit;font-size:1.05rem;line-height:1.55;resize:none;box-shadow:inset 0 2px 8px rgba(0,0,0,.2);transition:border-color .25s ease,background .25s ease}
.field:focus{border-color:rgba(255,196,120,.6);background:rgba(255,245,235,.1)}
.field::placeholder{color:rgba(228,207,211,.65)}
#layer{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.lantern{position:absolute;width:48px;height:64px;border-radius:16px 16px 10px 10px;
  background:radial-gradient(circle at 50% 62%,#fff8dc 0%,#ffd78a 38%,#ff9654 88%);
  box-shadow:0 0 38px rgba(255,172,90,.82),0 0 12px rgba(255,230,170,.6),inset 0 -10px 16px rgba(195,70,30,.38);
  border:1px solid rgba(255,240,200,.45);padding:0;pointer-events:none;transition:transform .2s ease}
.lantern::before{content:"";position:absolute;left:9px;right:9px;top:-4px;height:5px;border-radius:4px;background:#7a3e22;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.lantern::after{content:"";position:absolute;left:13px;right:13px;bottom:-5px;height:6px;border-radius:4px;background:#7a3e22;box-shadow:0 4px 10px rgba(255,190,100,.7)}
.lantern.hers{
  background:radial-gradient(circle at 50% 62%,#fff0f6 0%,#ffb8d2 38%,#f06296 88%);
  box-shadow:0 0 38px rgba(255,110,160,.82),0 0 12px rgba(255,210,230,.55),inset 0 -10px 16px rgba(180,35,95,.38);
  border-color:rgba(255,220,235,.48)}
.lantern.hers::before,.lantern.hers::after{background:#7d2444}
.lantern.fly{bottom:-90px;animation:rise 9s cubic-bezier(.3,.1,.5,1) forwards}
@keyframes rise{0%{transform:translate(0,0) rotate(-3deg);opacity:1}50%{transform:translate(18px,-55vh) rotate(3deg)}100%{transform:translate(-10px,-125vh) rotate(-2deg);opacity:.9}}
.lantern.drift{bottom:-90px;pointer-events:auto;animation:loop var(--d,26s) linear var(--dl,0s) infinite}
.lantern.drift:hover{filter:brightness(1.12)}
@keyframes loop{0%{transform:translate(0,0) rotate(-3deg)}25%{transform:translate(16px,-32vh) rotate(3deg)}50%{transform:translate(-12px,-64vh) rotate(-2deg)}75%{transform:translate(14px,-96vh) rotate(3deg)}100%{transform:translate(-6px,-130vh) rotate(-2deg)}}
.legend{display:flex;gap:16px;justify-content:center;align-items:center;font-size:.86rem;color:var(--muted);margin:.15rem 0 .65rem}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:6px;vertical-align:-1px;background:linear-gradient(180deg,#ffe0a8,#ff9d63);box-shadow:0 0 8px rgba(255,170,90,.6)}
.legend i.hers{background:linear-gradient(180deg,#ffd6e6,#f2689a);box-shadow:0 0 8px rgba(255,110,160,.6)}
.who{margin:0 0 .55rem;font-family:var(--sans);font-size:.74rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.who.his{color:#b86518}.who.hers{color:#b8346a}
.editfield{width:100%;min-height:120px;border-radius:12px;border:1px solid rgba(58,42,42,.25);background:#fffdf9;color:var(--ink);padding:.75rem .9rem;font:inherit;font-size:1.05rem;line-height:1.5;resize:none}
.notecard{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:rgba(12,6,16,.76);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:enter .3s ease both;overflow:auto}
.notecard .paper{max-width:420px;width:100%}

/* tilt to peek: holographic parallax cards */
.holo{--w:min(280px,72vw);position:relative;width:var(--w);height:calc(var(--w) * 1.34);margin:.9rem auto .6rem;touch-action:none;user-select:none;-webkit-user-select:none}
.hslot{position:absolute;inset:0;perspective:900px;transform-style:preserve-3d}
.hslot.in-r{animation:hinr .42s cubic-bezier(.22,1,.36,1) both}
.hslot.in-l{animation:hinl .42s cubic-bezier(.22,1,.36,1) both}
.hslot.out-l{animation:houtl .38s ease-in both;pointer-events:none}
.hslot.out-r{animation:houtr .38s ease-in both;pointer-events:none}
@keyframes hinr{from{transform:translateX(70%) rotate(9deg);opacity:0}to{transform:none;opacity:1}}
@keyframes hinl{from{transform:translateX(-70%) rotate(-9deg);opacity:0}to{transform:none;opacity:1}}
@keyframes houtl{to{transform:translateX(-70%) rotate(-9deg);opacity:0}}
@keyframes houtr{to{transform:translateX(70%) rotate(9deg);opacity:0}}
.hcard{position:absolute;inset:auto;left:50%;top:50%;width:calc(var(--pw,252px) + 28px);height:calc(var(--ph,252px) + 84px);margin:calc((var(--ph,252px) + 84px) / -2) 0 0 calc((var(--pw,252px) + 28px) / -2);transform-style:preserve-3d;transform:rotateX(calc(var(--ty,0) * -12deg)) rotateY(calc(var(--tx,0) * 12deg));will-change:transform}
.hback,.hphoto,.hsheen,.hglare,.hcap,.hsp{position:absolute}
.hback{inset:0;border-radius:18px;overflow:hidden;background:#1d1220;box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,220,180,.28);transform:translate3d(calc(var(--tx,0) * -8px),calc(var(--ty,0) * -8px),-30px) scale(1.06)}

      clearTimeout(t); shown.textContent = text; rest.remove(); cur = null; writePause();
      if (idx >= lines.length) { finishAll(); return; }
      waiting = true; timer = setTimeout(() => startNext(false), reduce ? 0 : 1000);
    };
    cur = { skip: done };
    if (reduce || instant) { done(); return; }
    writeOn();
    const tick = () => {
      k++; shown.textContent = chars.slice(0, k).join(''); rest.textContent = chars.slice(k).join('');
      if (k >= chars.length) { done(); return; }
      t = setTimeout(tick, /[.,!?]/.test(chars[k - 1]) ? 240 : 26);
    };
    tick();
  };
  paper.addEventListener('click', () => {
    if (finished) return;
    if (cur) cur.skip();
    else if (waiting) startNext(true);
  });
  sc.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); paper.click(); } });
  return { paper, start: (delay) => { timer = setTimeout(() => startNext(false), reduce ? 0 : delay); }, stop: () => { finished = true; clearTimeout(timer); writeEnd(); } };
}

function cakeSVG() {
  /* a three-quarter view: two round tiers with shaded sides, elliptical tops, frosting drips, pearls and a ribbon.
     The candle bases still sit on the top tier at y = 88, so the candles line up exactly. */
  const CX = 150;
  const arcY = (cy, rx, ry, x) => cy + ry * Math.sqrt(Math.max(0, 1 - Math.pow((x - CX) / rx, 2)));
  const body = (rx, top, bot, ry) => 'M' + (CX - rx) + ' ' + top + ' V' + bot + ' A' + rx + ' ' + ry + ' 0 0 0 ' + (CX + rx) + ' ' + bot + ' V' + top + ' Z';
  const drips = (cy, rx, ry, base, amp, ph, fill) => {
    const lo = [], hi = [];
    for (let x = CX - rx; x <= CX + rx + 0.01; x += 2) {

      const edge = Math.min(1, (rx - Math.abs(x - CX)) / 10);
      lo.push(x.toFixed(1) + ' ' + (a + (base + amp * g) * edge).toFixed(1)); hi.push(x.toFixed(1) + ' ' + a.toFixed(1));

    + '<linearGradient id="cPeach" x1="0" x2="1"><stop offset="0" stop-color="#e5b383"/><stop offset=".2" stop-color="#ffdcb4"/><stop offset=".45" stop-color="#ffead0"/><stop offset=".8" stop-color="#f2c595"/><stop offset="1" stop-color="#d49d6c"/></linearGradient>'
    + '<linearGradient id="cCream" x1="0" x2="1"><stop offset="0" stop-color="#ecdacb"/><stop offset=".25" stop-color="#fff7ee"/><stop offset=".6" stop-color="#fffaf3"/><stop offset="1" stop-color="#e6d2c3"/></linearGradient>'
    + '<radialGradient id="cTop" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#fffefb"/><stop offset=".7" stop-color="#fbeee1"/><stop offset="1" stop-color="#efdccb"/></radialGradient>'
    + '<linearGradient id="cShade" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".26"/><stop offset=".2" stop-color="#000" stop-opacity="0"/><stop offset=".3" stop-color="#fff" stop-opacity=".16"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".34"/></linearGradient>'
    + '<linearGradient id="cDark" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient>'
    + '<linearGradient id="cGold" x1="0" x2="1"><stop offset="0" stop-color="#c98d48"/><stop offset=".22" stop-color="#f6cf86"/><stop offset=".4" stop-color="#fff0c4"/><stop offset=".78" stop-color="#e2a95c"/><stop offset="1" stop-color="#b87a3a"/></linearGradient>'

    /* top tier */
    + '<path d="' + body(70, 88, 142, 10) + '" fill="url(#cPeach)"/>'
    + '<path d="' + body(70, 88, 142, 10) + '" fill="url(#cShade)"/><path d="' + body(70, 88, 142, 10) + '" fill="url(#cDark)"/>'
    + '<path d="M' + (CX - 70) + ' 116 A70 10 0 0 0 ' + (CX + 70) + ' 116 V126 A70 10 0 0 1 ' + (CX - 70) + ' 126 Z" fill="url(#cGold)"/>'
    + '<path d="M' + (CX - 70) + ' 116 A70 10 0 0 0 ' + (CX + 70) + ' 116 V126 A70 10 0 0 1 ' + (CX - 70) + ' 126 Z" fill="url(#cShade)" opacity=".7"/>'

    + pearls(88, 70, 10, 2, 11, 2.3)
    /* decorations */

    + '<g transform="translate(150 188) scale(.68) translate(-150 -172)"><path d="M150 188 C138 178 130 170 136 163 C141 158 148 160 150 166 C152 160 159 158 164 163 C170 170 162 178 150 188Z" fill="#7a2c45" opacity=".28"/><path d="M150 186 C138 176 130 168 136 161 C141 156 148 158 150 164 C152 158 159 156 164 161 C170 168 162 176 150 186Z" fill="url(#cHeart)"/></g>'

    + '</svg>';

/* light the candles (tap, or blow), the cake glides closer, make a wish, blow them out, and the smoke gathers into words */
add('candle', (root, api) => {
  const N = Math.max(1, Math.min(7, parseInt(CONFIG.candles, 10) || 5));
  const fold = el('div', { class: 'fold' }, el('h2', { text: tr('candleH') }), el('p', { class: 'lead', text: tr('candleLead') }));
  const capH = el('h2'), capP = el('p', { class: 'lead' });
  const spans = wordSpans(capH, tr('hbd', { mom: CONFIG.mom })).concat(wordSpans(capP, tr('loved')));
  const cap = el('div', { class: 'cap' }, capH, capP);
  const top = el('div', { class: 'slot top' }, el('div', { class: 'stack' }, fold, cap));
  const box = el('div', { class: 'cakebox' }), cake = el('div', { class: 'cake' });
  cake.innerHTML = cakeSVG(); cake.prepend(el('div', { class: 'glow' })); box.append(cake);
  const COL = ['#ff8fb1', '#8fd3ff', '#ffd76b', '#9be7b0', '#c9a7ff', '#ffb36b', '#ff9bb3'];
  const wicks = [];
  const meterFill = el('i'), meter = el('div', { class: 'meter', role: 'img', 'aria-label': tr('meterAria') }, meterFill);
  const hint = el('p', { class: 'hint', text: tr('candleTap') });
  const bot = el('div', { class: 'slot bot' }, meter, hint);
  let phase = 'light', litCount = 0, outCount = 0, dead = false, micOk = false, deaf = false, blowFrom = 0, armT = 0, stopWatch = () => {};
  const isLit = (w) => w.classList.contains('lit');
  const paintHint = () => {
    if (phase === 'light') hint.textContent = micOk ? tr('candleBlow') : tr('candleTap');
    else if (phase === 'blow') hint.textContent = (micOk ? tr('candleWishBlow') : tr('candleWishTap')) + (micOk && deaf ? tr('micDeaf') : '');
    else hint.textContent = '';
  };
  const onLevel = (lv, isDeaf) => { meterFill.style.width = Math.round(Math.max(0, Math.min(1, lv)) * 100) + '%'; if (isDeaf && !deaf) { deaf = true; paintHint(); } };
  const arm = (onBlow, delay, showMeter) => {
    clearTimeout(armT); stopWatch(); stopWatch = () => {};
    if (!micWanted) return;
    armT = setTimeout(() => {
      if (dead) return;
      startMic().then((ok) => {
        if (dead) { if (ok) stopMic(); return; }
        micOk = ok;
        if (ok) { if (showMeter) meter.classList.add('live'); stopWatch = watchBlow(onBlow, showMeter ? onLevel : null); }
        paintHint();
      });
    }, delay || 0);
  };
  const puff = (w) => {
    for (let i = 0; i < 3; i++) { const s = el('i', { class: 'smoke' }); s.style.setProperty('--sx', Math.round(Math.random() * 44 - 22) + 'px'); s.style.animationDelay = (i * 0.28) + 's'; w.append(s); setTimeout(() => s.remove(), 3600); }
  };
  const lightOne = (w) => {
    if (dead || phase !== 'light' || isLit(w)) return;
    w.classList.add('lit'); w.setAttribute('aria-pressed', 'true'); litCount++;
    cake.style.setProperty('--g', (litCount / N).toFixed(2)); setWarm(0.25 + 0.75 * litCount / N); chime(litCount); vib(12);
    if (litCount === N) allLit();
  };
  const lightRest = () => wicks.filter((w) => !isLit(w)).forEach((w, i) => wait(() => lightOne(w), i * 170));
  const snuff = (w) => {
    if (dead || phase !== 'blow' || !isLit(w) || Date.now() < blowFrom) return;
    w.classList.remove('lit'); w.setAttribute('aria-pressed', 'false'); outCount++;
    if (outCount < N) puff(w);
    cake.style.setProperty('--g', ((N - outCount) / N).toFixed(2)); chime(7 - outCount); vib(14);
    if (outCount === N) allOut();
  };
  const snuffRest = () => wicks.filter(isLit).forEach((w, i) => wait(() => snuff(w), i * 170));
  const allLit = () => {
    phase = 'blow'; stopWatch(); stopWatch = () => {}; blowFrom = Date.now() + (reduce ? 0 : 1800);
    const zoom = Math.max(1.1, Math.min(1.3, (window.innerWidth - 6) / (cake.offsetWidth || 1)));
    box.style.setProperty('--zoom', zoom.toFixed(3));
    fold.classList.add('gone'); box.classList.add('near'); setWarm(1); paintHint();

  };

    phase = 'done'; clearTimeout(armT); stopWatch(); stopMic(); meter.classList.remove('live'); paintHint(); setWarm(0.8);
    wait(() => box.classList.remove('near'), 350);
    const tips = wicks.map((w) => { const r = w.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height * 0.1 }; });
    smokeToWords(tips, spans, () => { if (dead) return; cap.classList.add('show'); wait(() => { if (!dead) api.ready(); }, 900); });
  };
  for (let i = 0; i < N; i++) {
    const x = N === 1 ? 150 : 108 + 84 * i / (N - 1);
    const w = el('button', { class: 'wick', type: 'button', 'aria-label': tr('candleAria', { n: i + 1, t: N }), 'aria-pressed': 'false' });
    w.innerHTML = candleSVG(COL[i % COL.length]); w.style.left = (x / 300 * 100).toFixed(2) + '%'; w.style.setProperty('--fd', (-i * 0.35) + 's');
    w.addEventListener('click', () => { if (phase === 'light') lightOne(w); else if (phase === 'blow') snuff(w); });
    cake.append(w); wicks.push(w);
  }
  root.append(top, box, bot);
  arm(lightRest, 0, false);
  return () => { dead = true; clearTimeout(armT); stopWatch(); stopMic(); stopSmoke(); };
});

/* connect the stars */
add('stars', (root, api) => {
  const PTS = [[50, 82], [26, 58], [19, 35], [34, 21], [50, 35], [66, 21], [81, 35], [74, 58]], N = PTS.length;
  const msgs = CONFIG.memories.filter(Boolean).concat(tr('stars')).slice(0, 8);
  root.append(el('h2', { text: tr('starsH') }), el('p', { class: 'small', text: tr('starsSmall') }));
  const box = el('div', { class: 'constel' });
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 100 100'); svg.setAttribute('aria-hidden', 'true');
  const poly = document.createElementNS(NS, 'polygon'); poly.setAttribute('points', PTS.map((p) => p.join(',')).join(' ')); poly.setAttribute('class', 'fill'); svg.append(poly);
  const lines = PTS.map((p, i) => {
    const q = PTS[(i + 1) % N], l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', p[0]); l.setAttribute('y1', p[1]); l.setAttribute('x2', q[0]); l.setAttribute('y2', q[1]); l.setAttribute('class', 'edge');
    l.style.setProperty('--len', Math.hypot(p[0] - q[0], p[1] - q[1]).toFixed(2)); svg.append(l); return l;
  });
  const trail = document.createElementNS(NS, 'line'); trail.setAttribute('class', 'trail'); svg.append(trail);
  box.append(svg);
  const msg = el('p', { class: 'msg', 'aria-live': 'polite' }), count = el('p', { class: 'count', text: tr('starsCount', { n: 0 }) });
  const lit = new Set(), edges = new Set(), btns = [];
  let last = -1, first = -1, swiping = false, closed = false;
  const neighbor = (a, b) => (a + 1) % N === b || (b + 1) % N === a;
  const edgeOf = (a, b) => ((a + 1) % N === b ? a : b);
  const paintCount = () => {
    count.textContent = closed ? tr('starsAll') : (lit.size === N && edges.size < N) ? tr('starsBack') : tr('starsCount', { n: lit.size });
  };
  const flare = (i) => { const f = el('i', { class: 'flare' }); f.style.left = PTS[i][0] + '%'; f.style.top = PTS[i][1] + '%'; box.append(f); setTimeout(() => f.remove(), 1100); };
  const finish = () => {   /* the closing words appear the moment the heart closes, while the fill glows in behind them */
    closed = true; box.classList.add('done'); btns.forEach((b) => b.classList.remove('start')); paintCount();
    msg.textContent = tr('starsEnd'); emerge(msg, centerOf(box), 950); api.ready();
  };
  const stepTo = (j, byTap) => {
    if (closed) return;
    let drew = false;
    if (last >= 0 && last !== j && neighbor(last, j)) {
      const e = edgeOf(last, j);
      if (!edges.has(e)) { edges.add(e); lines[e].classList.add('on'); drew = true; }
    }
    const isNew = !lit.has(j);
    if (isNew) {
      lit.add(j); btns[j].classList.add('on'); chime(lit.size - 1); vib(10); flare(j);
      if (first < 0) { first = j; btns[j].classList.add('start'); }
    }
    if (isNew || (byTap && !drew)) { msg.textContent = msgs[j]; emerge(msg, centerOf(btns[j]), 950); }
    last = j; paintCount();
    if (edges.size === N) { flare(j); finish(); }
  };
  PTS.forEach((p, i) => {
    const b = el('button', { class: 'cstar', type: 'button', 'aria-label': tr('starAria', { n: i + 1 }), text: '✦' }); b.style.left = p[0] + '%'; b.style.top = p[1] + '%';
    b.addEventListener('click', (e) => { if (e.detail === 0) stepTo(i, true); });
    box.append(b); btns.push(b);
  });
  const toBox = (e) => { const r = box.getBoundingClientRect(); return [(e.clientX - r.left) / (r.width || 1) * 100, (e.clientY - r.top) / (r.height || 1) * 100]; };
  const hit = (x, y) => { let best = -1, bd = 1e9; PTS.forEach((p, i) => { const d = Math.hypot(p[0] - x, p[1] - y); if (d < bd) { bd = d; best = i; } }); return bd <= 8.5 ? best : -1; };
  const drawTrail = (x, y) => {
    if (!swiping || last < 0 || closed) { trail.classList.remove('on'); return; }
    trail.setAttribute('x1', PTS[last][0]); trail.setAttribute('y1', PTS[last][1]); trail.setAttribute('x2', x.toFixed(2)); trail.setAttribute('y2', y.toFixed(2)); trail.classList.add('on');
  };
  box.addEventListener('pointerdown', (e) => {
    swiping = true; try { box.setPointerCapture(e.pointerId); } catch (err) {}
    const [x, y] = toBox(e), i = hit(x, y); if (i >= 0) stepTo(i, true); drawTrail(x, y);
  });
  box.addEventListener('pointermove', (e) => {
    if (!swiping) return;
    const [x, y] = toBox(e), i = hit(x, y);
    if (i >= 0 && i !== last && last >= 0 && neighbor(last, i)) stepTo(i, false);
    drawTrail(x, y);
  });
  const endSwipe = () => { swiping = false; trail.classList.remove('on'); };
  ['pointerup', 'pointercancel'].forEach((ev) => box.addEventListener(ev, endSwipe));
  root.append(box, msg, count);
});

add('lantern', (root, api) => {
  root.append(el('h2', { text: tr('wishH') }), el('p', { class: 'small', text: tr('wishSmall') }));
  const ta = el('textarea', { class: 'field', maxlength: '300', 'aria-label': tr('wishH'), placeholder: tr('wishPlace', { mom: CONFIG.mom }) });
  const chips = el('div', { class: 'chips' }, tr('starters').map((s) => el('button', { class: 'chip', type: 'button', text: s, onclick: () => { if (!ta.value.trim()) { ta.value = s + ' '; ta.dispatchEvent(new Event('input')); } ta.focus(); } })));
  const send = el('button', { class: 'btn', type: 'button', text: tr('release'), disabled: true });
  const status = el('p', { class: 'hint', style: 'min-height:3em;margin-top:.7rem' });
  let busy = false;
  const refresh = () => { send.disabled = busy || rec.recording() || !(ta.value.trim() || rec.has()); };
  const rec = voiceRecorder(refresh);
  ta.addEventListener('input', refresh);
  send.addEventListener('click', async () => {
    const text = ta.value.trim(); if (!text && !rec.has()) return;
    busy = true; refresh(); status.textContent = tr('sending');
    let voice = null;
    if (rec.has()) { const v = rec.take(); voice = await voiceUpload(v.blob, v.mime, v.secs); if (!voice) { busy = false; refresh(); status.textContent = tr('voiceFail'); return; } }
    const r = await lanternAdd(text || VOICE_ONLY, voice);
    if (!r) { if (voice) voiceRemove(voice.path); busy = false; refresh(); status.textContent = voice ? tr('voiceFail') : tr('cloudFail'); return; }
    flyLantern(myNum()); chime(4); vib([20, 40, 20]);
    ta.value = ''; rec.reset(); busy = false; refresh(); status.textContent = tr('sent'); api.ready();
  });
  root.append(ta, chips, rec.node, el('p', { class: 'small', style: 'margin:.2rem auto .5rem', text: tr('voiceHint') }), el('div', { class: 'row', style: 'margin-top:.2rem' }, send), status);
  return () => { rec.destroy(); };
});

/* a gentle check-in: if the next scenes would be too much, she can go straight to the lanterns at the end */
add('checkin', (root, api) => {
  const here = SCENES.findIndex((x) => x.id === 'checkin'), last = () => SCENES.length - 1;
  const ok = el('button', { class: 'btn', type: 'button', text: tr('checkOk') });
  const skip = el('button', { class: 'btn ghost', type: 'button', text: tr('checkSkip') });
  root.append(el('h2', { text: tr('checkH') }), el('p', { class: 'lead', text: tr('checkLead') }),
    el('div', { class: 'checkrow' }, ok, skip), el('p', { class: 'small', text: tr('checkNote') }));
  nextBtn.style.display = 'none';
  const choose = (i) => { ok.disabled = true; skip.disabled = true; chime(i === last() ? 3 : 1); api.go(i); };
  ok.addEventListener('click', () => choose(here + 1));
  skip.addEventListener('click', () => choose(last()));
  return () => { nextBtn.style.display = ''; };
});

if (CONFIG.photos.length) {
  add('photos', (root, api) => {
    const P = CONFIG.photos, N = P.length;
    const S = { i: 0, seen: new Set([0]), finished: false, mode: 'tilt' };
    const timers = [], ints = []; let dead = false, raf = 0;
    /* the one real photo: the page dims around it, the hearts stop, and it develops slowly inside a plain gold frame */
    const realNow = () => !!(P[S.i] && P[S.i].original);
    const capOf = (n) => (P[n].original ? (CONFIG.realCaption || 'The real one') : (P[n].caption || ''));
    const veil = el('div', { id: 'veil', 'aria-hidden': 'true' }); document.body.insertBefore(veil, document.getElementById('sky'));
    const applyReal = () => { const on = realNow(); root.classList.toggle('realmode', on); veil.classList.toggle('on', on); setDim(on ? 1 : 0); };
    const later = (fn, ms) => { const t = wait(() => { if (!dead) fn(); }, ms); timers.push(t); return t; };
    const clamp = (v) => Math.max(-1, Math.min(1, v));
    const pad2 = (n) => String(n).padStart(2, '0');
    const tick = (vol, hz) => {
  if (!soundOn || !ac || ac.state !== 'running') return;
  const t = ac.currentTime, len = Math.floor(ac.sampleRate * 0.045), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / len, 3);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = buf; f.type = 'bandpass'; f.frequency.value = hz || 1800; f.Q.value = 0.9; g.gain.value = (vol || 1) * 2.4;
  s.connect(f); f.connect(g); g.connect(sfxGain); s.start(t);
};


    /* ---- shared: colours taken from each photo ---- */
    const FALLBACK = [[255, 196, 120], [255, 158, 158], [255, 170, 200], [255, 214, 150], [255, 180, 140], [240, 170, 255], [255, 205, 120]];
    const glows = {};
    const setGlow = (n) => root.style.setProperty('--glow', (glows[n] || FALLBACK[n % FALLBACK.length]).join(','));
    let onAR = () => {};
    P.forEach((p, n) => {
      const im = new Image();
      im.onload = () => {
        if (im.naturalWidth && im.naturalHeight) { p.ar = im.naturalWidth / im.naturalHeight; onAR(n); }
        try {
          const cv = document.createElement('canvas'); cv.width = cv.height = 24; const g = cv.getContext('2d'); g.drawImage(im, 0, 0, 24, 24);
          const d = g.getImageData(0, 0, 24, 24).data; let r = 0, gg = 0, b = 0, w = 0;
          for (let k = 0; k < d.length; k += 4) {
            const R = d[k], G = d[k + 1], B = d[k + 2], mx = Math.max(R, G, B), mn = Math.min(R, G, B), sat = mx ? (mx - mn) / mx : 0, lum = (R + G + B) / 3;
            if (lum < 25 || lum > 235) continue; const wt = 0.15 + sat * sat * 3; r += R * wt; gg += G * wt; b += B * wt; w += wt;
          }
          if (!w) return; let c = [r / w, gg / w, b / w]; const m = Math.max(...c), sc = m ? Math.min(1.6, 225 / m) : 1;
          glows[n] = c.map((v) => Math.min(255, Math.round(v * sc))); if (S.i === n) setGlow(n);
        } catch (e) { /* canvas blocked on file://, the fallback colours stay */ }
      };
      im.src = p.src;
    });
    setGlow(0);

    
    const mark = (n) => {
      applyReal();
      S.seen.add(n);
      if (!S.finished && S.seen.size === N) { S.finished = true; api.ready(); tilt.hintNow(); slides.hintNow(); }
    };

    /* ================= TILT ================= */
    const tilt = (() => {
      const holo = el('div', { class: 'holo' });
      const g1 = el('div', { class: 'hghost g1' }, el('img', { alt: '' })), g2 = el('div', { class: 'hghost g2' }, el('img', { alt: '' }));
      holo.append(el('div', { class: 'hdeck' }, g2, g1));
      const hint = el('p', { class: 'phint', 'aria-live': 'polite' });
      const count = el('p', { class: 'hcount' });
      const tgt = { x: 0, y: 0, px: 0.5, py: 0.5 }, cur = { x: 0, y: 0, px: 0.5, py: 0.5 };
      let card = null, busy = false, lastGyro = 0, gyroOn = false, base = null, pressed = false, hintKey = 'holoHint';
      const holoW = () => Math.min(280, window.innerWidth * 0.72);
      const dimsOf = (n) => { const r = P[n].ar || 1, hw = holoW(), pw = Math.min(hw - 28, (hw * 1.34 - 84) * r); return [Math.round(pw), Math.round(pw / r)]; };
      const setDims = (node, n) => { const d = dimsOf(n); node.style.setProperty('--pw', d[0] + 'px'); node.style.setProperty('--ph', d[1] + 'px'); };
      const kScale = () => (holo.getBoundingClientRect().width / holo.offsetWidth) || 1;
      const currentSlot = () => holo.querySelector('.hslot:not(.out-l):not(.out-r):not(.flingout)');
      const hintNow = () => { hint.textContent = S.finished ? tr('holoDone') : tr(hintKey); };

      const make = (n) => {
        const p = P[n], real = !!p.original, fx = el('div', { class: 'hfx' });
        for (let k = 0; k < (real ? 0 : 14); k++) {
          const s = el('i', { class: 'f-hearts' }); s.style.left = (Math.random() * 96) + '%';
          s.style.setProperty('--d', (-Math.random() * 9) + 's'); s.style.setProperty('--t', (6 + Math.random() * 6) + 's');
          s.style.setProperty('--sz', (6 + Math.random() * 10) + 'px'); s.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px'); fx.append(s);
        }
        const c = el('div', { class: 'hcard' + (real ? ' real' : '') },
          el('div', { class: 'hback' }, real ? null : el('img', { src: p.src, alt: '' })),
          el('div', { class: 'hphoto' }, el('img', { class: real ? 'develop' : '', src: p.src, alt: capOf(n), draggable: 'false' })),
          el('div', { class: 'hsheen' }), el('div', { class: 'hglare' }), el('p', { class: 'hcap', text: capOf(n) }), fx);
        setDims(c, n);
        return { slot: el('div', { class: 'hslot' }, c), c };
      };
      /* swiping either way always reveals the NEXT photo, which is the one waiting right behind the card */
      const peekTo = (dx) => {
        holo.classList.add('peeking');
        g1.style.setProperty('--rv', Math.min(1, Math.abs(dx) / (holo.offsetWidth * 0.6)).toFixed(3));
      };
      const unpeek = () => { g1.style.removeProperty('--rv'); holo.classList.remove('peeking'); };
      const label = () => { count.textContent = (S.i + 1) + ' / ' + N; };
      const updateDeck = () => {
        g1.hidden = N < 2; g2.hidden = N < 3;
        g1.firstChild.src = P[(S.i + 1) % N].src; g2.firstChild.src = P[(S.i + 2) % N].src; setDims(g1, (S.i + 1) % N); setDims(g2, (S.i + 2) % N); unpeek();
        [g1, g2].forEach((g) => { g.classList.remove('bump'); void g.offsetWidth; g.classList.add('bump'); });
      };

      /* dir > 0: the next photo rises from the stack. dir < 0: the previous photo slides in from the left (arrow only).
         exitDx (swipes only): the side the finger threw the old card to. */
      const go = (n, dir, exitDx) => {
        if (busy || N < 2) return; busy = true;
        const oldSlot = currentSlot();
        S.i = (n + N) % N; const m = make(S.i);
        m.slot.classList.add(dir > 0 ? 'in-deck' : 'in-l');
        if (oldSlot) holo.insertBefore(m.slot, oldSlot); else holo.append(m.slot);
        if (oldSlot) {
          const side = exitDx != null ? (exitDx < 0 ? -1 : 1) : (dir > 0 ? -1 : 1);
          if (exitDx != null) {
            oldSlot.classList.remove('drag'); oldSlot.classList.add('flingout');
            oldSlot.style.translate = (side * 130) + '% 0'; oldSlot.style.rotate = (side * 28) + 'deg'; oldSlot.style.opacity = '0';
          } else oldSlot.classList.add(side < 0 ? 'out-l' : 'out-r');
          later(() => oldSlot.remove(), 460);
        }
        card = m.c; later(() => { m.slot.classList.remove('in-deck', 'in-l'); busy = false; }, 700);
        if (!realNow()) { chime(S.i); vib(8); }
        label(); updateDeck(); setGlow(S.i); mark(S.i); hintNow();
      };
      const refit = () => { if (card) setDims(card, S.i); setDims(g1, (S.i + 1) % N); setDims(g2, (S.i + 2) % N); };
      onAR = (n) => { if (n === S.i || n === (S.i + 1) % N || n === (S.i + 2) % N) refit(); };
      window.addEventListener('resize', refit);
      const sync = (n) => {
        holo.querySelectorAll('.hslot').forEach((s) => s.remove()); busy = false;
        S.i = n; const m = make(n); holo.append(m.slot); card = m.c; label(); updateDeck(); setGlow(n); hintNow();
      };

      /* frame loop: smooth tilt + shimmer sound that follows how fast she tilts */
      let shim = null, prevX = 0, prevY = 0, spd = 0, fn = 0;
      const shimStart = () => {
        if (shim || !soundOn || !ac) return;
        try {
          const o1 = ac.createOscillator(), o2 = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain();
          o1.type = 'sine'; o2.type = 'triangle'; lp.type = 'lowpass'; lp.frequency.value = 2400; g.gain.value = 0;
          o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(ac.destination); o1.start(); o2.start(); shim = { o1, o2, g };
        } catch (e) { shim = null; }
      };
      const shimStop = () => {
        if (!shim) return; const s = shim; shim = null;
        try { s.g.gain.setTargetAtTime(0, ac.currentTime, 0.05); } catch (e) {}
        setTimeout(() => { try { s.o1.stop(); s.o2.stop(); s.g.disconnect(); } catch (e) {} }, 300);
      };
      const frame = () => {
        if (dead) return;
        if (S.mode === 'tilt') {
          if (realNow()) { tgt.x = 0; tgt.y = 0; tgt.px = 0.5; tgt.py = 0.5; }
          for (const k of ['x', 'y', 'px', 'py']) cur[k] += (tgt[k] - cur[k]) * 0.14;
          if (card) {
            card.style.setProperty('--tx', cur.x.toFixed(3)); card.style.setProperty('--ty', cur.y.toFixed(3));
            card.style.setProperty('--gx', (cur.px * 100).toFixed(1) + '%'); card.style.setProperty('--gy', (cur.py * 100).toFixed(1) + '%');
          }
          spd += (Math.hypot(cur.x - prevX, cur.y - prevY) - spd) * 0.2; prevX = cur.x; prevY = cur.y;
          if (soundOn && ac && ac.state === 'running') {
            shimStart();
            if (shim && (fn++ % 2 === 0)) {
              const mag = Math.min(1.4, Math.hypot(cur.x, cur.y)), f = 520 + mag * 620, t = ac.currentTime;
              shim.o1.frequency.setTargetAtTime(f, t, 0.06); shim.o2.frequency.setTargetAtTime(f * 1.5, t, 0.06); shim.g.gain.setTargetAtTime(Math.min(spd * 1.6, 1) * 0.02, t, 0.05);
            }
          } else shimStop();
        } else shimStop();
        raf = requestAnimationFrame(frame);
      };
      const aim = (e) => {
        if (performance.now() - lastGyro < 800) return;
        const r = holo.getBoundingClientRect(), nx = ((e.clientX - r.left) / r.width) * 2 - 1, ny = ((e.clientY - r.top) / r.height) * 2 - 1;
        tgt.x = clamp(nx); tgt.y = clamp(ny); tgt.px = (clamp(nx) + 1) / 2; tgt.py = (clamp(ny) + 1) / 2;
      };
      const rest = () => { if (performance.now() - lastGyro < 800) return; tgt.x = 0; tgt.y = 0; tgt.px = 0.5; tgt.py = 0.5; };

      let mdx = 0, down = false, moved = false, dragging = false, sx = 0, sy = 0, lastX = 0, lastT = 0, vx = 0, curSlot = null;
      holo.addEventListener('pointerdown', (e) => {
        if (busy) return;
        down = true; pressed = true; moved = false; dragging = false; sx = lastX = e.clientX; sy = e.clientY; lastT = performance.now(); vx = 0; mdx = 0;
        curSlot = currentSlot(); try { holo.setPointerCapture(e.pointerId); } catch (er) {}
        aim(e);
      });
      holo.addEventListener('pointermove', (e) => {
        if (e.pointerType === 'mouse' || pressed) aim(e);
        if (!down) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        if (!moved && Math.hypot(dx, dy) > 12) moved = true;
        if (moved && !dragging && Math.abs(dx) > Math.abs(dy) * 1.2 && N > 1) dragging = true;
        if (dragging && curSlot) {
          const now = performance.now(), k = kScale(); vx = (e.clientX - lastX) / Math.max(1, now - lastT); lastX = e.clientX; lastT = now;
          curSlot.classList.remove('spring'); curSlot.classList.add('drag'); curSlot.style.translate = (dx / k) + 'px 0'; curSlot.style.rotate = (dx / k / 22) + 'deg'; mdx = dx; peekTo(dx / k);
        }
      });
      holo.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && !pressed) rest(); });
      const endP = (e, cancelled) => {
        if (!down) return; down = false; pressed = false;
        const dx = (dragging ? mdx : e.clientX - sx);
        if (dragging && curSlot) {
          if (!cancelled && (Math.abs(dx) > 80 || Math.abs(vx) > 0.55)) go(S.i + 1, 1, Math.abs(dx) > 8 ? dx : vx);
          else { const s = curSlot; unpeek(); s.classList.remove('drag'); s.classList.add('spring'); s.style.translate = '0 0'; s.style.rotate = '0deg'; setTimeout(() => s.classList.remove('spring'), 520); }
        } else if (!cancelled && !moved) { const r = centerOf(holo); burst(r.x, r.y); chime(S.i + 2); vib(10); }
        if (e.pointerType !== 'mouse') rest();
      };
      holo.addEventListener('pointerup', (e) => endP(e, false));
      holo.addEventListener('pointercancel', (e) => endP(e, true));

      const onOri = (e) => {
        if (e.gamma == null || e.beta == null) return;
        lastGyro = performance.now(); gyroOn = true;
        if (!base) base = { g: e.gamma, b: e.beta };
        base.g += (e.gamma - base.g) * 0.006; base.b += (e.beta - base.b) * 0.006;
        const dx = clamp((e.gamma - base.g) / 22), dy = clamp((e.beta - base.b) / 22);
        tgt.x = dx; tgt.y = dy; tgt.px = (dx + 1) / 2; tgt.py = (dy + 1) / 2;
      };
      const listen = () => window.addEventListener('deviceorientation', onOri);
      const needsPerm = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';
      const permBtn = el('button', { class: 'btn ghost', type: 'button', text: tr('holoEnable') });
      if (needsPerm) {
        permBtn.addEventListener('click', () => {
          DeviceOrientationEvent.requestPermission().then((s) => {
            if (s === 'granted') { listen(); permBtn.remove(); hintKey = 'holoHint'; } else hintKey = 'holoNoTilt'; hintNow();
          }).catch(() => { hintKey = 'holoNoTilt'; hintNow(); });
        });
      } else if (typeof DeviceOrientationEvent !== 'undefined') listen();
      const coarse = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
      if (!needsPerm) later(() => { if (!gyroOn) { hintKey = coarse ? 'holoDrag' : 'holoMouse'; hintNow(); } }, 1800);

      const prev = el('button', { class: 'iconbtn', type: 'button', 'aria-label': tr('photoPrev'), text: '‹', onclick: () => go(S.i - 1, -1) });
      const next = el('button', { class: 'iconbtn', type: 'button', 'aria-label': tr('photoNext'), text: '›', onclick: () => go(S.i + 1, 1) });
      const panel = el('div', { class: 'ppanel' }, holo, hint);
      if (needsPerm) panel.append(permBtn);
      panel.append(el('div', { class: 'hnav' }, N > 1 ? prev : null, count, N > 1 ? next : null));
      sync(0);
      if (!reduce) raf = requestAnimationFrame(frame);
      return {
        panel, hintNow, sync,
        activate: () => { sync(S.i); applyReal(); },
        deactivate: () => { shimStop(); },
        destroy: () => { cancelAnimationFrame(raf); window.removeEventListener('deviceorientation', onOri); window.removeEventListener('resize', refit); shimStop(); },
      };
    })();

    /* ================= SLIDES ================= */
    const slides = (() => {
      const img = el('img', { class: 'simg', alt: '', draggable: 'false' });
      const dl = el('a', { class: 'sdl', 'aria-label': tr('slidesDownload'), title: tr('slidesDownload') });
      dl.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>';
      dl.addEventListener('pointerdown', (e) => e.stopPropagation()); dl.addEventListener('pointerup', (e) => e.stopPropagation()); dl.addEventListener('click', (e) => e.stopPropagation());
      const scap = el('p', { class: 'scap' });
      const fig = el('div', { class: 'sfig' }, img, dl, scap);
      const view = el('div', { class: 'sview', tabindex: '0', role: 'group', 'aria-label': tr('slidesSmall') }, fig);
      const count = el('p', { class: 'hcount' });
      const hint = el('p', { class: 'phint', 'aria-live': 'polite' });
      const prev = el('button', { class: 'iconbtn', type: 'button', 'aria-label': tr('photoPrev'), text: '‹', onclick: () => show((S.i - 1 + N) % N) });
      const next = el('button', { class: 'iconbtn', type: 'button', 'aria-label': tr('photoNext'), text: '›', onclick: () => show((S.i + 1) % N) });
      const panel = el('div', { class: 'ppanel' }, view, hint, el('div', { class: 'hnav' }, N > 1 ? prev : null, count, N > 1 ? next : null));
      const hintNow = () => { hint.textContent = S.finished ? tr('slidesEnd') : tr('slidesHint'); };
      const paint = (fade) => {
        const p = P[S.i], real = !!p.original; img.src = p.src; img.alt = capOf(S.i);
        fig.classList.toggle('real', real); scap.textContent = real ? capOf(S.i) : ''; img.classList.remove('develop'); if (real) { void img.offsetWidth; img.classList.add('develop'); }
        dl.href = p.src; dl.setAttribute('download', (p.src.split('/').pop() || 'photo').split('?')[0]);
        count.textContent = (S.i + 1) + ' / ' + N;
        if (fade) { fig.classList.remove('swap'); void fig.offsetWidth; fig.classList.add('swap'); }
      };
      const show = (n) => { if (N < 2) return; S.i = n; paint(true); if (!P[n].original) { chime(n); vib(8); } mark(n); hintNow(); };
      let sx = 0, sy = 0, dn = false, onDl = false;
      view.addEventListener('pointerdown', (e) => { dn = true; sx = e.clientX; sy = e.clientY; });
      view.addEventListener('pointerup', (e) => {
        if (!dn) return; dn = false; const dx = e.clientX - sx, dy = e.clientY - sy;
        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) show((S.i + 1) % N);
        else if (Math.hypot(dx, dy) < 10) show((S.i + 1) % N);
      });
      view.addEventListener('pointercancel', () => { dn = false; });
      view.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); show((S.i + 1) % N); } else if (e.key === 'ArrowLeft') { e.preventDefault(); show((S.i - 1 + N) % N); } });
      return { panel, hintNow, activate: () => { paint(false); hintNow(); applyReal(); }, deactivate: () => {} };
    })();

    /* ================= switcher ================= */
    const small = el('p', { class: 'small' });
    const bT = el('button', { class: 'pm', type: 'button', role: 'tab', text: tr('modeTilt'), onclick: () => setMode('tilt') });
    const bF = el('button', { class: 'pm', type: 'button', role: 'tab', text: tr('modeSlides'), onclick: () => setMode('slides') });
    const pmode = el('div', { class: 'pmode', role: 'tablist', 'aria-label': tr('modeLabel') }, bT, bF);
    const modes = { tilt, slides };
    const setMode = (m, first) => {
      if (!first && m === S.mode) return;
      const prevM = modes[S.mode]; if (!first && prevM) { prevM.deactivate(); prevM.panel.hidden = true; }
      S.mode = m; window.__wlMode = m;
      const cur = modes[m]; cur.panel.hidden = false; cur.panel.style.animation = 'none'; void cur.panel.offsetWidth; cur.panel.style.animation = '';
      bT.classList.toggle('on', m === 'tilt'); bF.classList.toggle('on', m === 'slides');
      bT.setAttribute('aria-selected', m === 'tilt'); bF.setAttribute('aria-selected', m === 'slides');
      small.textContent = tr(m === 'tilt' ? 'holoSmall' : 'slidesSmall'); small.hidden = !small.textContent; chime(m === 'tilt' ? 4 : 2); vib(8);
      cur.activate();
    };
    root.append(pmode, el('h2', { text: tr('photosH') }), small, tilt.panel, slides.panel);
    let noteOff = null;
    if (CONFIG.photoNote) {
      const ptext = el('span', { class: 'ptext' });
      CONFIG.photoNote.split('🤍').forEach((part, k, all) => { ptext.append(document.createTextNode(part)); if (k < all.length - 1) ptext.append(el('span', { class: 'phrt', 'aria-hidden': 'true', text: '♥' })); });
      const note = el('div', { class: 'pnote', role: 'status' },
        el('div', { class: 'pcloud' }, ptext),
        el('i', { class: 'pdot d1' }), el('i', { class: 'pdot d2' }), el('i', { class: 'pdot d3' }));
      root.append(note);
      /* one single cloud outline: every puff shares the same gradient (fixed to the whole cloud), so there are no seams */
      const drawCloud = () => {
        const c = note.querySelector('.pcloud'); if (!c) return;
        const w = c.offsetWidth, h = c.offsetHeight; if (!w || !h) return;
        const pad = 60, NS = 'http://www.w3.org/2000/svg', side = note.classList.contains('side'), bo = side ? 17 : 9;
        const old = c.querySelector('.pshape'); if (old) old.remove();
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('class', 'pshape'); svg.setAttribute('width', w + pad * 2); svg.setAttribute('height', h + pad * 2); svg.setAttribute('aria-hidden', 'true');
        svg.style.left = -pad + 'px'; svg.style.top = -pad + 'px';
        const circles = [
          [0.24 * w, -26 + 0.17 * w, 0.17 * w], [0.52 * w, -40 + 0.21 * w, 0.21 * w], [0.77 * w, -25 + 0.16 * w, 0.16 * w],
          [0.27 * w, h + bo - 0.15 * w, 0.15 * w], [0.66 * w, h + bo - 1 - 0.14 * w, 0.14 * w],
          [-9 + 0.11 * w, 0.3 * h + 0.11 * w, 0.11 * w], [w + 11 - 0.12 * w, 0.36 * h + 0.12 * w, 0.12 * w],
          [0.09 * w, h + 3 - 0.09 * w, 0.09 * w], [0.46 * w, h + bo - 3 - 0.1 * w, 0.1 * w], [0.87 * w, h + 4 - 0.1 * w, 0.1 * w], [0.1 * w, 6 + 0.07 * w, 0.07 * w]
        ];
        const defs = '<defs><linearGradient id="pcg" gradientUnits="userSpaceOnUse" x1="0" y1="' + (pad - 40) + '" x2="0" y2="' + (pad + h + 18) + '"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#fff8f1"/><stop offset="1" stop-color="#f1dfea"/></linearGradient>'
          + '<radialGradient id="pch" gradientUnits="userSpaceOnUse" cx="' + (pad + 0.3 * w) + '" cy="' + (pad - 8) + '" r="' + (0.75 * w) + '"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>';
        const shapes = '<rect x="' + pad + '" y="' + pad + '" width="' + w + '" height="' + h + '" rx="' + Math.min(34, h / 2) + '"/>' + circles.map((q) => '<circle cx="' + (pad + q[0]).toFixed(1) + '" cy="' + (pad + q[1]).toFixed(1) + '" r="' + q[2].toFixed(1) + '"/>').join('');
        svg.innerHTML = defs + '<clipPath id="pcc">' + shapes + '</clipPath><g fill="url(#pcg)">' + shapes + '</g><rect x="0" y="0" width="' + (w + pad * 2) + '" height="' + (h + pad * 2) + '" fill="url(#pch)" clip-path="url(#pcc)"/>';
        c.insertBefore(svg, c.firstChild);
      };
      const place = () => {
        const r = root.getBoundingClientRect(), k = r.width / Math.max(1, root.offsetWidth);
        note.classList.toggle('side', window.innerWidth - r.right >= (252 + 54) * k + 12);
        drawCloud();
      };
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!dead) drawCloud(); });
      place(); window.addEventListener('resize', place); noteOff = () => window.removeEventListener('resize', place);
      const secs = Math.max(2, Number(CONFIG.photoNoteSeconds) || 5);
      later(() => { place(); note.classList.remove('out'); note.classList.add('show'); }, 1000);
      later(() => { note.classList.remove('show'); note.classList.add('out'); }, 1000 + secs * 1000);
    }
    slides.panel.hidden = true;
    setMode(window.__wlMode === 'slides' ? 'slides' : 'tilt', true);
    if (N === 1) { S.finished = true; api.ready(); }
    return () => { dead = true; timers.forEach(clearTimeout); ints.forEach(clearInterval); tilt.destroy(); if (noteOff) noteOff(); setDim(0); veil.classList.remove('on'); setTimeout(() => veil.remove(), 1700); };
  });
}

add('balloons', (root, api) => {
  const P = tr('proms'), COL = ['#ff8aa8', '#ffb36b', '#c9a7ff', '#7fd0c4', '#ffd36b', '#8fb4ff'];
  root.append(el('h2', { text: tr('promH') }), el('p', { class: 'small', text: tr('promSmall') }));
  const grid = el('div', { class: 'balloons' }), card = el('p', { class: 'pcard', 'aria-live': 'polite' });
  let popped = 0;
  P.forEach((txt, i) => {
    const b = el('button', { class: 'balloon', type: 'button', 'aria-label': tr('balloon', { n: i + 1, t: P.length }) }); b.style.setProperty('--c', COL[i % COL.length]); b.style.setProperty('--dl', (-i * 0.55) + 's');
    b.addEventListener('click', () => {
      if (b.classList.contains('pop')) return;
      const from = centerOf(b);
      burst(from.x, from.y); sfxPop(); vib(18);
      b.classList.add('pop'); b.disabled = true; popped++;
      card.textContent = txt; emerge(card, from, 900);
      if (popped === P.length) wait(() => { card.textContent = tr('promEnd'); emerge(card, null); api.ready(); }, 5200);
    });
    grid.append(b);
  });
  root.append(grid, card);
});

add('final', (root, api) => {
  setWarm(1);
  let dead = false;
  const note = el('p', { class: 'small', style: 'min-height:2.9em' }), legend = el('p', { class: 'legend' });
  root.append(el('div', { class: 'beat', 'aria-hidden': 'true', text: '🕯️' }), el('h1', { text: tr('hbd', { mom: CONFIG.mom }) }), el('p', { class: 'lead', text: tr('finalLead') }), note, legend);
  const lanternIdx = SCENES.findIndex((s) => s.id === 'lantern');
  root.append(el('div', { class: 'row' },
    el('button', { class: 'btn', type: 'button', text: tr('another'), onclick: () => api.go(lanternIdx) }),
    el('button', { class: 'btn ghost', type: 'button', text: tr('again'), onclick: () => api.go(0) }),
    el('a', { class: 'btn ghost', href: 'index.html', text: tr('home'), onclick: (e) => { e.preventDefault(); leave(); } })));
  const clear = () => layer.querySelectorAll('.drift').forEach((n) => n.remove());
  const paint = (rows) => {
    clear(); legend.textContent = ''; note.textContent = '';

    note.textContent = tr('finalWishes');
    const me = myNum(), other = me === 2 ? 1 : 2;
    [[me, tr('legYours')], [other, other === 2 ? tr('legHer') : tr('legHim')]].forEach((it) => legend.append(el('span', {}, el('i', { class: it[0] === 2 ? 'hers' : '' }), it[1])));
    const shown = rows.slice(-14);

      const L = el('button', { class: 'lantern drift' + (n.author_num === 2 ? ' hers' : '') + (n.voice_path ? ' voiced' : ''), type: 'button', 'aria-label': tr('readWish') + (n.voice_path ? ' · ' + tr('voicePlayLabel') : '') });
      if (n.voice_path) L.append(el('span', { class: 'vmark', 'aria-hidden': 'true', text: '♪' }));
      L.style.left = (6 + (i * 89) / Math.max(1, shown.length - 1)) % 92 + '%'; L.style.setProperty('--d', (24 + (i % 4) * 4) + 's'); L.style.setProperty('--dl', (-i * 3.1) + 's');

/* ───────── frame ───────── */
const stage = $('#stage'), nextBtn = $('#next'), backBtn = $('#back'), nav = $('#nav'), dots = $('#dots');
let cur = -1, cleanup = null, busy = false, fitRO = null;
function fit() {
  const f = stage.firstElementChild; if (!f) return;
  const cs = getComputedStyle(stage), availH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (!(availH > 0)) return;
  const need = f.offsetHeight;
  let s = need > availH ? availH / need : 1;
  const tooSmall = s < 0.5; if (tooSmall) s = 0.5;
  f.style.transform = s < 1 ? 'scale(' + s.toFixed(4) + ')' : '';
  stage.style.overflowY = tooSmall ? 'auto' : 'hidden';
}
window.addEventListener('resize', () => fit());
function leave() { stopMic(); try { if (window.opener) { window.close(); } } catch (e) {} setTimeout(() => { location.href = 'index.html'; }, 120); }
function markReady() { nextBtn.classList.add('pulse'); }
function updateNav() {
  const first = cur === 0, last = cur === SCENES.length - 1, hide = first || last;
  nav.style.display = hide ? 'none' : 'flex'; document.body.classList.toggle('nonav', hide);
  backBtn.style.visibility = cur <= 1 ? 'hidden' : 'visible';
  nextBtn.classList.remove('pulse');
  dots.querySelectorAll('i').forEach((d, i) => { d.className = i === cur ? 'on' : i < cur ? 'past' : ''; });
}
function go(n) {
  if (busy || n < 0 || n >= SCENES.length) return;
  busy = true;
  const old = stage.firstElementChild;
  const swap = () => {
    if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
    if (fitRO) { fitRO.disconnect(); fitRO = null; }
    stage.textContent = ''; stage.style.overflowY = 'hidden'; cur = n;
    const sc = el('section', { class: 'scene', 'data-scene': SCENES[n].id }), f = el('div', { class: 'fit' }, sc); stage.append(f); updateNav();
    try { cleanup = SCENES[n].render(sc, { ready: markReady, go: (i) => go(i) }) || null; }
    catch (e) { console.error(e); sc.append(el('p', { class: 'lead', text: tr('oops') })); markReady(); }
    fit(); requestAnimationFrame(fit);
    if (window.ResizeObserver) { fitRO = new ResizeObserver(() => fit()); fitRO.observe(f); }
    busy = false;
  };
  if (old && !reduce) { const s = old.firstElementChild; if (s) s.classList.add('out'); setTimeout(swap, 240); } else swap();
}
nextBtn.addEventListener('click', () => go(cur + 1));
backBtn.addEventListener('click', () => go(cur - 1));
$('#exit').addEventListener('click', leave);
$('#snd').addEventListener('click', () => setSound(!soundOn));
document.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;
  if (e.key === 'ArrowRight' && cur > 0 && cur < SCENES.length - 1) go(cur + 1);
  if (e.key === 'ArrowLeft' && cur > 1) go(cur - 1);
  if (e.key === 'Escape') { const c = $('.notecard'); if (c) c.remove(); }
});

document.addEventListener('pointerdown', (e) => {
  if (reduce || (e.target.closest && e.target.closest('canvas,textarea,input,.constel,.paper'))) return;
  for (let i = 0; i < 4; i++) {
    const n = el('i', { class: 'spark' }), a = Math.random() * 6.283, d = 18 + Math.random() * 26;
    n.style.left = e.clientX + 'px'; n.style.top = e.clientY + 'px';
    n.style.setProperty('--dx', Math.cos(a) * d + 'px'); n.style.setProperty('--dy', Math.sin(a) * d + 'px'); n.style.setProperty('--rot', '0deg');
    document.body.append(n); setTimeout(() => n.remove(), 950);
  }
});

/* ───────── start ───────── */
SCENES.forEach(() => dots.append(el('i')));
nextBtn.textContent = tr('next'); backBtn.textContent = tr('back'); $('#exit').setAttribute('aria-label', tr('exit')); paintSoundBtn();
go(0);
})();
